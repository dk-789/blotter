<body>
<!--
  Blotter — see README.md in this repo for full developer docs
  (architecture, storage keys, external services, calc notes).
  Quick orientation: single-file app, React+Babel via CDN, no build
  step — edit the JSX inside the main babel-type script tag and reload.
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>

<style>
  :root{
    --bg:#12181A;
    --panel:#182022;
    --panel-2:#1D2629;
    --line:#2A3538;
    --line-soft:#212B2E;
    --ink:#E8E4D8;
    --ink-dim:#9AA5A3;
    --ink-faint:#5F6B69;
    --gain:#5FAE82;
    --gain-bg:rgba(95,174,130,0.12);
    --loss:#C0654A;
    --loss-bg:rgba(192,101,74,0.12);
    --brass:#D8B25C;
    --brass-dim:#8C7639;
    --radius:5px;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
    --sans:'IBM Plex Sans', -apple-system, sans-serif;
    --display:'Space Grotesk', var(--sans);
  }
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);

    font-family:var(--sans);

  .headline-value{font-family:var(--mono); font-size:38px; font-weight:600; line-height:1;}

  .headline-value.loss{color:var(--loss);}

  .ccy-toggle{max-width:140px; margin-bottom:0;}

  .btn{

  .btn.secondary{background:none; border:1px solid var(--line); color:var(--ink); font-weight:500;}

  .inline-btn{display:flex; gap:8px; align-items:center;}

  .combo-row{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}

  .toggle-row{display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap;}
  .toggle-row button{

  .import-box{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px;}
  .import-box h3{font-family:var(--display); font-size:14px; margin:0 0 4px;}

  .import-log{margin-top:10px; font-size:12px; font-family:var(--mono); color:var(--ink-dim); white-space:pre-wrap;}

  .badge{font-family:var(--mono); font-size:10.5px; padding:2px 5px; border-radius:3px; border:1px solid var(--line); color:var(--ink-faint);}

  .mobile-tabs{display:none;}
  @media (max-width:820px){
    #app{flex-direction:column;}
    .rail{width:auto; border-right:none; border-bottom:1px solid var(--line); flex-direction:row; align-items:center; flex-wrap:wrap; padding:14px 16px;}

<div id="app"></div>

<script type="text/babel" data-presets="react">
const {useState, useEffect, useMemo, useRef} = React;

const TABS = [
  {id:'overview', label:'Overview'},
  {id:'holdings', label:'Holdings'},
  {id:'history', label:'Trade history'},
  {id:'stats', label:'Stats'},
  {id:'sizer', label:'Position sizer'},
  {id:'log', label:'Log a trade'},
  {id:'import', label:'Import'},
  {id:'settings', label:'Settings'},
];

const SEED_ACCOUNT_1 = {"name": "TFSA 1", "holdings": [], "realized": [], "activity": [], "cash": []};

const SEED_ACCOUNT_2 = {"name": "TFSA 2", "holdings": [], "realized": [], "activity": [], "cash": []};

function uid(){ return 'a' + Math.random().toString(36).slice(2,9); }
function fmt(n, digits=2){
  if(n===null || n===undefined || isNaN(n)) return '—';
  const sign = n<0 ? '-' : '';
  return sign + Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:digits, maximumFractionDigits:digits});
}
function fmtMoney(n, ccy, digits=2){
  if(n===null || n===undefined || isNaN(n)) return '—';
  return fmt(n,digits) + ' ' + (ccy||'');
}
function plClass(n){ return n>0?'gain':(n<0?'loss':''); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

async function storageGet(key, shared=false){
  try{
    const v = window.localStorage.getItem('blotter_v1:'+key);
    return v===null ? null : v;
  }catch(e){ return null; }
}
async function storageSet(key, value, shared=false){
  try{ window.localStorage.setItem('blotter_v1:'+key, value); return true; }
  catch(e){ return false; }
}

// ---------- CSV parsing / normalization ----------

function detectCsvType(headers){
  const h = headers.map(x=>x.trim());
  if(h.includes('realized_return_cad')) return 'realized';
  if(h.includes('Market Unrealized Returns')) return 'holdings';
  if(h.includes('activity_type')) return 'activity';
  return 'unknown';
}

function parseNum(v){
  if(v===undefined || v===null || v==='') return null;
  const n = parseFloat(String(v).replace(/[",]/g,''));
  return isNaN(n) ? null : n;
}

function normalizeHoldings(rows){
  return rows
    .filter(r => (r['Security Type']||'').trim() !== 'CURRENCY')
    .map(r => {
      const qty = parseNum(r['Quantity']);
      const bookValueMarket = parseNum(r['Book Value (Market)']);
      const marketValue = parseNum(r['Market Value']);
      const secType = (r['Security Type']||'').trim();
      // For options, Book Value (Market) is the TOTAL dollar cost (already ×100 per
      // contract), but Market Price is a per-share/per-unit quote — divide by
      // qty*100 so avgCost lines up with Market Price on the same per-share basis.
      const multiplier = secType === 'OPTION' ? 100 : 1;
      const avgCost = (qty && bookValueMarket!==null) ? bookValueMarket/(qty*multiplier) : null;
      return {
        id: uid(),
        symbol: (r['Symbol']||'').trim(),
        name: (r['Name']||'').trim(),
        secType: secType,
        qty: qty,
        marketPrice: parseNum(r['Market Price']),
        marketPriceCcy: (r['Market Price Currency']||'').trim(),
        avgCost: avgCost,
        bookValueCad: parseNum(r['Book Value (CAD)']),
        marketValue: marketValue,
        marketValueCcy: (r['Market Value Currency']||'').trim(),
        unrealized: parseNum(r['Market Unrealized Returns']),
        unrealizedCcy: (r['Market Unrealized Returns Currency']||'').trim(),
        source: 'import',
      };
    })
    .filter(h => h.symbol);
}

// Currency/cash line items in a holdings export (Security Type === CURRENCY) —
// these are cash sitting in the account, not open positions, but they count
// toward the account's total value.
function normalizeCash(rows){
  return rows
    .filter(r => (r['Security Type']||'').trim() === 'CURRENCY')
    .map(r => ({
      ccy: (r['Market Value Currency']||r['Symbol']||'').trim(),
      amount: parseNum(r['Market Value']),
      bookValueCad: parseNum(r['Book Value (CAD)']),
    }))
    .filter(c => c.ccy && c.amount !== null);
}

function normalizeRealized(rows){
  return rows.map(r => ({
    id: uid(),
    date: (r['effective_at']||'').slice(0,10),
    symbol: (r['symbol']||'').trim(),
    name: (r['name']||'').trim(),
    orderId: r['order_id']||'',
    realizedCad: parseNum(r['realized_return_cad']),
    realizedUsd: parseNum(r['realized_return_usd']),
    netProceedsCad: parseNum(r['net_proceeds_cad']),
    netProceedsUsd: parseNum(r['net_proceeds_usd']),
    initialInvCad: parseNum(r['initial_investment_cad']),
    initialInvUsd: parseNum(r['initial_investment_usd']),
    fx: parseNum(r['fx_rate']),
    source: 'import',
  })).filter(r => r.symbol);
}

function normalizeActivity(rows){
  return rows.map(r => ({
    id: uid(),
    date: r['effective_date']||'',
    time: r['effective_time']||'',
    type: r['activity_type']||'',
    subType: r['activity_sub_type']||'',
    description: r['description']||'',
    direction: r['direction']||'',
    symbol: (r['symbol']||'').trim(),
    quantity: parseNum(r['quantity']),
    unitPrice: parseNum(r['unit_price']),
    commission: parseNum(r['commission']),
    netCash: parseNum(r['net_cash_amount']),
    ccy: r['currency']||'',
  }));
}

// ---------- Price lookup via Alpaca Market Data API (standalone version) ----------
// Alpaca's TRADING API supports browser CORS, but its MARKET DATA API
// (data.alpaca.markets — what we need for quotes) has a long-standing, unresolved
// CORS bug for direct browser requests (see alpacahq/Alpaca-API#152). This may or
// may not work depending on Alpaca's current state — if it fails, the error below
// will say so plainly rather than fail silently.

// ---------- Cloud sync via Supabase ----------
// Supabase's REST API supports CORS properly (unlike Alpaca's data API), so
// this actually works from a plain browser page. There's no real per-user
// login here — the "sync key" you set acts as a shared secret between your
// own devices. Treat it like a password: long, random, never shared.

function getSupabaseConfig(){
  try{
    const raw = window.localStorage.getItem('blotter_v1:supabase_config');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveSupabaseConfig(url, anonKey, syncKey){
  window.localStorage.setItem('blotter_v1:supabase_config', JSON.stringify({url, anonKey, syncKey}));
}
function clearSupabaseConfig(){
  window.localStorage.removeItem('blotter_v1:supabase_config');
}

async function gatherFullState(){
  const accountsRaw = await storageGet('blotter:accounts');
  const accounts = accountsRaw ? JSON.parse(accountsRaw) : [];
  const byAccount = {};
  for(const a of accounts){
    byAccount[a.id] = {
      holdings: JSON.parse((await storageGet('blotter:holdings:'+a.id)) || '[]'),
      realized: JSON.parse((await storageGet('blotter:realized:'+a.id)) || '[]'),
      activity: JSON.parse((await storageGet('blotter:activity:'+a.id)) || '[]'),
      cash: JSON.parse((await storageGet('blotter:cash:'+a.id)) || '[]'),
    };
  }
  const fxrateRaw = await storageGet('blotter:fxrate');
  return {accounts, byAccount, fxrate: fxrateRaw ? JSON.parse(fxrateRaw) : null};
}

async function restoreFullState(state){
  await storageSet('blotter:accounts', JSON.stringify(state.accounts||[]));
  for(const a of (state.accounts||[])){
    const d = (state.byAccount && state.byAccount[a.id]) || {holdings:[],realized:[],activity:[],cash:[]};
    await storageSet('blotter:holdings:'+a.id, JSON.stringify(d.holdings||[]));
    await storageSet('blotter:realized:'+a.id, JSON.stringify(d.realized||[]));
    await storageSet('blotter:activity:'+a.id, JSON.stringify(d.activity||[]));
    await storageSet('blotter:cash:'+a.id, JSON.stringify(d.cash||[]));
  }
  if(state.fxrate) await storageSet('blotter:fxrate', JSON.stringify(state.fxrate));
}

function supabaseHeaders(cfg, extra){
  return Object.assign({
    'apikey': cfg.anonKey,
    'Authorization': 'Bearer ' + cfg.anonKey,
    'Content-Type': 'application/json',
  }, extra||{});
}

async function pushToCloud(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.url || !cfg.anonKey || !cfg.syncKey) throw new Error('Set up cloud sync in Settings first.');
  const state = await gatherFullState();
  const updatedAt = new Date().toISOString();
  let resp;
  try{
    resp = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/blotter_sync?on_conflict=sync_key', {
      method: 'POST',
      headers: supabaseHeaders(cfg, {'Prefer': 'resolution=merge-duplicates,return=minimal'}),
      body: JSON.stringify({sync_key: cfg.syncKey, data: state, updated_at: updatedAt}),
    });
  }catch(e){
    throw new Error('Could not reach Supabase — check the Project URL.');
  }
  if(!resp.ok){
    const text = await resp.text();
    throw new Error('Push failed (' + resp.status + '): ' + text.slice(0,200));
  }
  return updatedAt;
}

async function pullFromCloud(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.url || !cfg.anonKey || !cfg.syncKey) throw new Error('Set up cloud sync in Settings first.');
  let resp;
  try{
    resp = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/blotter_sync?sync_key=eq.' + encodeURIComponent(cfg.syncKey) + '&select=data,updated_at', {
      headers: supabaseHeaders(cfg),
    });
  }catch(e){
    throw new Error('Could not reach Supabase — check the Project URL.');
  }
  if(!resp.ok){
    const text = await resp.text();
    throw new Error('Pull failed (' + resp.status + '): ' + text.slice(0,200));
  }
  const rows = await resp.json();
  if(!rows.length) throw new Error('No cloud data found for this sync key yet — push from a device with your data first.');
  await restoreFullState(rows[0].data);
  return rows[0].updated_at;
}

async function checkCloudTimestamp(){
  const cfg = getSupabaseConfig();
  if(!cfg || !cfg.url || !cfg.anonKey || !cfg.syncKey) return null;
  try{
    const resp = await fetch(cfg.url.replace(/\/$/,'') + '/rest/v1/blotter_sync?sync_key=eq.' + encodeURIComponent(cfg.syncKey) + '&select=updated_at', {
      headers: supabaseHeaders(cfg),
    });
    if(!resp.ok) return null;
    const rows = await resp.json();
    return rows.length ? rows[0].updated_at : null;
  }catch(e){ return null; }
}

function getAlpacaCreds(){
  try{
    const raw = window.localStorage.getItem('blotter_v1:alpaca_creds');
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveAlpacaCreds(keyId, secret){
  window.localStorage.setItem('blotter_v1:alpaca_creds', JSON.stringify({keyId, secret}));
}
function clearAlpacaCreds(){
  window.localStorage.removeItem('blotter_v1:alpaca_creds');
}

async function lookupPrice(symbol){
  const creds = getAlpacaCreds();
  if(!creds || !creds.keyId || !creds.secret){
    throw new Error('No Alpaca API key set — add one in Settings first.');
  }
  if(isOptionSymbol(symbol)){
    throw new Error('Alpaca\'s free equities data does not cover options contracts — enter the premium manually.');
  }
  let response;
  try{
    response = await fetch('https://data.alpaca.markets/v2/stocks/' + encodeURIComponent(symbol) + '/trades/latest', {
      headers: {
        'APCA-API-KEY-ID': creds.keyId,
        'APCA-API-SECRET-KEY': creds.secret,
      }
    });
  }catch(networkErr){
    throw new Error('Could not reach Alpaca\'s data API from the browser — this is a known CORS limitation on Alpaca\'s side for data.alpaca.markets, not a problem with your key. See Settings for details.');
  }
  if(!response.ok){
    if(response.status===401 || response.status===403) throw new Error('Alpaca rejected the request (' + response.status + ') — check your API key ID and secret in Settings.');
    if(response.status===404) throw new Error('Alpaca has no data for "' + symbol + '".');
    throw new Error('Alpaca request failed (' + response.status + ').');
  }
  const data = await response.json();
  if(!data.trade || data.trade.p===undefined) throw new Error('No trade data returned for ' + symbol + '.');
  return {symbol, price: data.trade.p, currency: 'USD', asOf: data.trade.t || 'latest'};
}

// FX rate: Alpaca doesn't provide forex, so this uses Frankfurter (ECB-backed,
// free, no key required, CORS-enabled) instead. Frankfurter migrated its public
// API from api.frankfurter.app to api.frankfurter.dev (v2) — the old .app
// endpoint is no longer reliable, so this uses the current one.
async function lookupFxRate(){
  let response;
  try{
    response = await fetch('https://api.frankfurter.dev/v2/rate/USD/CAD');
  }catch(networkErr){
    throw new Error('Could not reach the FX rate service.');
  }
  if(!response.ok) throw new Error('FX lookup failed (' + response.status + ')');
  const data = await response.json();
  if(!data.rate) throw new Error('No FX rate returned.');
  return {usdToCad: data.rate, asOf: data.date || 'latest'};
}

// Convert a native-currency amount into the chosen display currency.
function convert(amount, fromCcy, toCcy, usdToCad){
  if(amount===null || amount===undefined || isNaN(amount)) return null;
  if(!fromCcy || fromCcy===toCcy) return amount;
  if(fromCcy==='USD' && toCcy==='CAD') return amount * (usdToCad||1);
  if(fromCcy==='CAD' && toCcy==='USD') return amount / (usdToCad||1);
  return amount;
}

// Realized rows carry both a CAD and USD column already — prefer the native
// column for the requested display currency, only falling back to the fx
// rate (e.g. for manual entries that only recorded one side).
function pickOrConvert(nativeCad, nativeUsd, displayCcy, usdToCad){
  if(displayCcy === 'CAD'){
    if(nativeCad!==null && nativeCad!==undefined) return nativeCad;
    if(nativeUsd!==null && nativeUsd!==undefined) return nativeUsd*(usdToCad||1);
    return null;
  } else {
    if(nativeUsd!==null && nativeUsd!==undefined) return nativeUsd;
    if(nativeCad!==null && nativeCad!==undefined) return nativeCad/(usdToCad||1);
    return null;
  }
}

// Classify a symbol/name as an option or a regular stock/ETF (2x leveraged ETFs
// count as stocks/ETFs here). Works for imported rows (which carry secType) and
// for realized-trade or manual rows that only have symbol/name.
function isOptionSymbol(symbol){
  if(!symbol) return false;
  const compact = symbol.replace(/\s+/g,'');
  // OCC-style: SYMBOL + 6-digit date + C/P + strike digits, e.g. AVGO260918C00450000
  if(/^[A-Z.]{1,6}\d{6}[CP]\d{5,8}$/.test(compact)) return true;
  // Manual "TSLA 18SEP26 300C" style: ends in number(s)+C/P and contains a date-like token
  if(/\d[CP]$/.test(symbol.trim()) && /\d{1,2}[A-Z]{3}\d{2}/.test(compact)) return true;
  return false;
}
function classifyAsset(row){
  if(row.secType === 'OPTION' || isOptionSymbol(row.symbol)) return 'OPTION';
  return 'STOCK';
}

const MONTH_ABBR = {JAN:0,FEB:1,MAR:2,APR:3,MAY:4,JUN:5,JUL:6,AUG:7,SEP:8,OCT:9,NOV:10,DEC:11};
// Extracts the expiry date (YYYY-MM-DD) from an option symbol, whether it's
// OCC-style from an import (e.g. "META  270115C00750000") or the manual
// "TSLA 18SEP26 300C" format built by the Log a trade form. Returns null if
// the symbol isn't an option or doesn't parse.
function parseOptionExpiry(symbol){
  if(!symbol) return null;
  const compact = symbol.replace(/\s+/g,'');
  let m = compact.match(/^[A-Z.]{1,6}(\d{2})(\d{2})(\d{2})[CP]\d{5,8}$/);
  if(m){
    const yy = parseInt(m[1],10), mm = parseInt(m[2],10), dd = parseInt(m[3],10);
    if(mm>=1 && mm<=12 && dd>=1 && dd<=31){
      return (2000+yy) + '-' + String(mm).padStart(2,'0') + '-' + String(dd).padStart(2,'0');
    }
  }
  m = compact.match(/(\d{1,2})([A-Z]{3})(\d{2})\d*[CP]$/);
  if(m && MONTH_ABBR.hasOwnProperty(m[2])){
    const dd = parseInt(m[1],10), mon = MONTH_ABBR[m[2]], yy = parseInt(m[3],10);
    const d = new Date(2000+yy, mon, dd);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  return null;
}

const ASSET_FILTERS = [
  {id:'ALL', label:'All'},
  {id:'STOCK', label:'Stocks / ETFs'},
  {id:'OPTION', label:'Options'},
];

const TIME_FILTERS = [
  {id:'ALL', label:'All time'},
  {id:'1D', label:'1D'},
  {id:'1W', label:'1W'},
  {id:'1M', label:'1M'},
  {id:'3M', label:'3M'},
  {id:'6M', label:'6M'},
  {id:'YTD', label:'YTD'},
  {id:'1Y', label:'1Y'},
];

// Returns a cutoff Date for a time-filter id, or null for 'ALL' (no cutoff).
// Filters by the date a trade actually closed, since that's the only dated
// history we have — there's no daily portfolio-value snapshot to filter open
// holdings by, so this only applies to closed trades (History / Stats) and to
// the reconstructed equity curve (Overview).
function timeFilterCutoff(id){
  const now = new Date();
  if(id === 'ALL') return null;
  if(id === 'YTD') return new Date(now.getFullYear(), 0, 1);
  const d = new Date(now);
  if(id === '1D') d.setDate(d.getDate()-1);
  else if(id === '1W') d.setDate(d.getDate()-7);
  else if(id === '1M') d.setMonth(d.getMonth()-1);
  else if(id === '3M') d.setMonth(d.getMonth()-3);
  else if(id === '6M') d.setMonth(d.getMonth()-6);
  else if(id === '1Y') d.setFullYear(d.getFullYear()-1);
  return d;
}
function withinTimeFilter(dateStr, timeFilter){
  if(timeFilter === 'ALL' || !dateStr) return true;
  const cutoff = timeFilterCutoff(timeFilter);
  return dateStr >= cutoff.toISOString().slice(0,10);
}

// Net money actually deposited into an account (deposits minus withdrawals),
// as distinct from cost basis — cost basis double-counts capital that gets
// bought, sold, and reused across multiple trades.
function computeNetDeposits(activity, displayCcy, usdToCad){
  return (activity||[]).filter(a=>a.type==='MoneyMovement').reduce((s,a)=>s+(convert(a.netCash,a.ccy,displayCcy,usdToCad)||0),0);
}

// ---------- Main App ----------

function App(){
  const [accounts, setAccounts] = useState([]);
  const [activeAccountId, setActiveAccountId] = useState(null); // account id, or 'ALL'
  const [tab, setTab] = useState('overview');
  const [data, setData] = useState({}); // { [accountId]: {holdings, realized, activity} }
  const [loaded, setLoaded] = useState(false);
  const [displayCcy, setDisplayCcy] = useState('CAD');
  const [fxRate, setFxRate] = useState(1.38);
  const [fxAsOf, setFxAsOf] = useState(null);
  const [fxLoading, setFxLoading] = useState(false);
  const [fxError, setFxError] = useState('');

  useEffect(() => {
    (async () => {
      let accts = await storageGet('blotter:accounts');
      accts = accts ? JSON.parse(accts) : [];
      const dataMap = {};
      if(accts.length === 0){
        const seeds = [SEED_ACCOUNT_1, SEED_ACCOUNT_2];
        accts = [];
        for(const seed of seeds){
          const id = uid();
          accts.push({id, name: seed.name});
          dataMap[id] = {
            holdings: seed.holdings,
            realized: seed.realized,
            activity: seed.activity,
            cash: seed.cash || [],
          };
          await storageSet('blotter:holdings:'+id, JSON.stringify(seed.holdings));
          await storageSet('blotter:realized:'+id, JSON.stringify(seed.realized));
          await storageSet('blotter:activity:'+id, JSON.stringify(seed.activity));
          await storageSet('blotter:cash:'+id, JSON.stringify(seed.cash || []));
        }
        await storageSet('blotter:accounts', JSON.stringify(accts));
      } else {
        const knownSeeds = {[SEED_ACCOUNT_1.name]: SEED_ACCOUNT_1.cash, [SEED_ACCOUNT_2.name]: SEED_ACCOUNT_2.cash};
        for(const a of accts){
          const h = await storageGet('blotter:holdings:'+a.id);
          const r = await storageGet('blotter:realized:'+a.id);
          const act = await storageGet('blotter:activity:'+a.id);
          const c = await storageGet('blotter:cash:'+a.id);
          let cashVal;
          if(c){
            cashVal = JSON.parse(c);
          } else {
            // Backfill: this account was saved before cash tracking existed.
            // If its name matches one of the original seed accounts, restore its cash.
            cashVal = knownSeeds[a.name] || [];
            await storageSet('blotter:cash:'+a.id, JSON.stringify(cashVal));
          }
          dataMap[a.id] = {
            holdings: h ? JSON.parse(h) : [],
            realized: r ? JSON.parse(r) : [],
            activity: act ? JSON.parse(act) : [],
            cash: cashVal,
          };
        }
      }
      const storedFx = await storageGet('blotter:fxrate');
      if(storedFx){
        try{
          const parsedFx = JSON.parse(storedFx);
          if(parsedFx.rate){ setFxRate(parsedFx.rate); setFxAsOf(parsedFx.asOf); }
        }catch(e){}
      }
      setAccounts(accts);
      setActiveAccountId('ALL');
      setData(dataMap);
      setLoaded(true);
      // Fetch a fresh FX rate in the background so the toggle has a real number quickly.
      doRefreshFx();
    })();
  }, []);

  async function doRefreshFx(){
    setFxLoading(true); setFxError('');
    try{
      const r = await lookupFxRate();
      setFxRate(r.usdToCad);
      setFxAsOf(r.asOf);
      await storageSet('blotter:fxrate', JSON.stringify({rate:r.usdToCad, asOf:r.asOf}));
    }catch(e){
      setFxError('Could not refresh the FX rate: ' + e.message);
    }
    setFxLoading(false);
  }

  async function updateAccountData(id, patch){
    setData(prev => ({...prev, [id]: {...prev[id], ...patch}}));
    const jobs = [];
    if(patch.holdings !== undefined) jobs.push(storageSet('blotter:holdings:'+id, JSON.stringify(patch.holdings)));
    if(patch.realized !== undefined) jobs.push(storageSet('blotter:realized:'+id, JSON.stringify(patch.realized)));
    if(patch.activity !== undefined) jobs.push(storageSet('blotter:activity:'+id, JSON.stringify(patch.activity)));
    if(patch.cash !== undefined) jobs.push(storageSet('blotter:cash:'+id, JSON.stringify(patch.cash)));
    await Promise.all(jobs);
  }

  async function addAccount(){
    const name = prompt('Name this account (e.g. "TFSA" or "Margin"):');
    if(!name) return;
    const id = uid();
    const next = [...accounts, {id, name}];
    setAccounts(next);
    setData(prev => ({...prev, [id]: {holdings:[], realized:[], activity:[], cash:[]}}));
    setActiveAccountId(id);
    await storageSet('blotter:accounts', JSON.stringify(next));
  }

  async function renameOrRemoveAccount(id){
    const acc = accounts.find(a=>a.id===id);
    const action = prompt('Type a new name for "'+acc.name+'", or type DELETE to remove this account:', acc.name);
    if(action === null) return;
    if(action.trim().toUpperCase() === 'DELETE'){
      if(!confirm('Remove "'+acc.name+'" and all its data? This cannot be undone.')) return;
      const next = accounts.filter(a=>a.id!==id);
      setAccounts(next);
      await storageSet('blotter:accounts', JSON.stringify(next));
      await storageSet('blotter:holdings:'+id, JSON.stringify([]));
      await storageSet('blotter:realized:'+id, JSON.stringify([]));
      await storageSet('blotter:activity:'+id, JSON.stringify([]));
      await storageSet('blotter:cash:'+id, JSON.stringify([]));
      if(activeAccountId === id) setActiveAccountId('ALL');
    } else if(action.trim()){
      const next = accounts.map(a => a.id===id ? {...a, name:action.trim()} : a);
      setAccounts(next);
      await storageSet('blotter:accounts', JSON.stringify(next));
    }
  }

  if(!loaded){
    return <div style={{padding:'40px', color:'var(--ink-faint)', fontFamily:'var(--mono)'}}>Loading blotter…</div>;
  }

  const combinedData = accounts.reduce((acc, a) => {
    const d = data[a.id] || {holdings:[], realized:[], activity:[], cash:[]};
    (d.holdings||[]).forEach(h => acc.holdings.push({...h, accountName:a.name, accountId:a.id}));
    (d.realized||[]).forEach(r => acc.realized.push({...r, accountName:a.name, accountId:a.id}));
    (d.activity||[]).forEach(x => acc.activity.push({...x, accountName:a.name, accountId:a.id}));
    (d.cash||[]).forEach(c => acc.cash.push({...c, accountName:a.name, accountId:a.id}));
    return acc;
  }, {holdings:[], realized:[], activity:[], cash:[]});

  const isAll = activeAccountId === 'ALL';
  const activeData = isAll ? combinedData : (data[activeAccountId] || {holdings:[], realized:[], activity:[], cash:[]});
  const activeAccountObj = isAll ? {id:'ALL', name:'All accounts'} : accounts.find(a=>a.id===activeAccountId);

  function acctTotalRealizedCad(d){ return (d.realized||[]).reduce((s,r)=>s+(r.realizedCad||0),0); }

  return (
    <div id="app">
      <div className="rail">
        <div className="brand"><span className="mark">▤</span> Blotter</div>
        <div>
          <div className="rail-section-label">Accounts</div>
          <div className="acct-list">
            <button
              className={"acct-btn all-accounts" + (isAll ? " active":"")}
              onClick={()=>setActiveAccountId('ALL')}>
              <span>All accounts</span>
              <span className={"pl " + plClass(acctTotalRealizedCad(combinedData))}>{combinedData.realized.length ? fmt(acctTotalRealizedCad(combinedData),0) : ''}</span>
            </button>
            {accounts.map(a => {
              const d = data[a.id] || {realized:[]};
              const tot = acctTotalRealizedCad(d);
              return (
                <button key={a.id}
                  className={"acct-btn" + (a.id===activeAccountId ? " active":"")}
                  onClick={()=>setActiveAccountId(a.id)}
                  onDoubleClick={()=>renameOrRemoveAccount(a.id)}
                  title="Double-click to rename or delete">
                  <span>{a.name}</span>
                  <span className={"pl " + plClass(tot)}>{tot?fmt(tot,0):''}</span>
                </button>
              );
            })}
            <button className="add-acct" onClick={addAccount}>+ Add account</button>
          </div>
        </div>
        <nav className="tabs">
          <div className="rail-section-label">View</div>
          {TABS.map(t => (
            <button key={t.id} className={tab===t.id?'active':''} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </nav>
      </div>

      <main>
        <div className="mobile-tabs">
          {TABS.map(t => (
            <button key={t.id} className={tab===t.id?'active':''} onClick={()=>setTab(t.id)}>{t.label}</button>
          ))}
        </div>

        {(tab==='overview' || tab==='holdings' || tab==='history' || tab==='stats' || tab==='sizer') && (
          <CurrencyBar displayCcy={displayCcy} setDisplayCcy={setDisplayCcy} fxRate={fxRate} fxAsOf={fxAsOf} fxLoading={fxLoading} fxError={fxError} onRefresh={doRefreshFx} />
        )}

        {tab==='overview' && <Overview accounts={accounts} data={data} displayCcy={displayCcy} fxRate={fxRate} />}
        {tab==='holdings' && <Holdings account={activeAccountObj} combined={isAll} d={activeData} displayCcy={displayCcy} fxRate={fxRate} dataByAccount={data} updateAccount={updateAccountData} />}
        {tab==='history' && <History account={activeAccountObj} combined={isAll} d={activeData} displayCcy={displayCcy} fxRate={fxRate} dataByAccount={data} updateAccount={updateAccountData} />}
        {tab==='stats' && <Stats account={activeAccountObj} d={activeData} displayCcy={displayCcy} fxRate={fxRate} />}
        {tab==='sizer' && (isAll
          ? <PickAccountNotice accounts={accounts} onPick={setActiveAccountId} action="size a trade" />
          : <PositionSizer account={activeAccountObj} d={activeData} displayCcy={displayCcy} fxRate={fxRate} />)}
        {tab==='log' && (isAll
          ? <PickAccountNotice accounts={accounts} onPick={setActiveAccountId} action="log a trade" />
          : <LogTrade account={activeAccountObj} d={activeData} onUpdate={p=>updateAccountData(activeAccountId,p)} />)}
        {tab==='import' && (isAll
          ? <PickAccountNotice accounts={accounts} onPick={setActiveAccountId} action="import a CSV" />
          : <Import account={activeAccountObj} d={activeData} onUpdate={p=>updateAccountData(activeAccountId,p)} />)}
        {tab==='settings' && <Settings />}
      </main>
    </div>
  );
}

function MonthlyPnl({data, displayCcy, fxRate}){
  const monthly = useMemo(() => {
    const bins = new Map();
    Object.values(data).forEach(d => {
      (d.realized||[]).forEach(r => {
        if(!r.date) return;
        const pl = pickOrConvert(r.realizedCad, r.realizedUsd, displayCcy, fxRate);
        if(pl === null) return;
        const month = r.date.slice(0,7);
        bins.set(month, (bins.get(month)||0) + pl);
      });
    });
    return Array.from(bins.entries()).sort((a,b)=>a[0].localeCompare(b[0])).map(([month,pl])=>({month,pl}));
  }, [data, displayCcy, fxRate]);

  const currentUnrealized = useMemo(() => {
    let u = 0;
    Object.values(data).forEach(d => {
      (d.holdings||[]).forEach(h => { u += convert(h.unrealized, h.unrealizedCcy, displayCcy, fxRate) || 0; });
    });
    return u;
  }, [data, displayCcy, fxRate]);

  const shown = monthly.slice(-24);
  const totalRealized = monthly.reduce((s,m)=>s+m.pl,0);
  const maxAbs = Math.max(...shown.map(m=>Math.abs(m.pl)), 1);
  const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  return (
    <div style={{marginBottom:'24px'}}>
      <div className="section-head"><h2>Monthly realized P&amp;L</h2></div>
      {shown.length === 0 ? (
        <div className="empty">No closed trades yet to chart.</div>
      ) : (
        <React.Fragment>
        <div style={{background:'var(--panel)', border:'1px solid var(--line)', borderRadius:'var(--radius)', padding:'16px'}}>
          <div style={{display:'flex', alignItems:'flex-end', gap:'6px', height:'160px'}}>
            {shown.map(m => {
              const heightPct = Math.max(2, Math.abs(m.pl)/maxAbs * 100);
              const isGain = m.pl >= 0;
              return (
                <div key={m.month} style={{flex:'1', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'flex-end', height:'100%', minWidth:'8px'}} title={m.month + ': ' + fmtMoney(m.pl,displayCcy,0)}>
                  <div style={{width:'100%', maxWidth:'32px', height: heightPct+'%', background: isGain?'var(--gain)':'var(--loss)', borderRadius:'2px 2px 0 0'}}></div>
                </div>
              );
            })}
          </div>
          <div style={{display:'flex', gap:'6px', marginTop:'6px'}}>
            {shown.map(m => {
              const [y,mo] = m.month.split('-');
              return (
                <div key={m.month+'l'} style={{flex:'1', textAlign:'center', fontSize:'10px', fontFamily:'var(--mono)', color:'var(--ink-faint)', minWidth:'8px'}}>{MONTH_NAMES[parseInt(mo,10)-1]}</div>
              );
            })}
          </div>
        </div>
        <div className="cards" style={{marginTop:'12px'}}>
          <div className="card"><div className="label">Total realized to date</div><div className={"value "+plClass(totalRealized)}>{fmtMoney(totalRealized,displayCcy,0)}</div></div>
          <div className="card"><div className="label">Current unrealized (not shown above)</div><div className={"value "+plClass(currentUnrealized)}>{fmtMoney(currentUnrealized,displayCcy,0)}</div></div>
        </div>
        <p className="hint" style={{marginTop:'10px'}}>Each bar is your net realized gain or loss for that month — hover a bar for the exact figure. This only covers trades that actually closed; unrealized gains/losses on anything still open are shown separately above, not folded into any month.</p>
        </React.Fragment>
      )}
    </div>
  );
}

function Overview({accounts, data, displayCcy, fxRate}){
  const totals = useMemo(()=>{
    let realized=0, unrealized=0, marketValue=0, cash=0, openPositions=0, contributions=0;
    Object.values(data).forEach(d => {
      (d.realized||[]).forEach(r=>{
        const v = pickOrConvert(r.realizedCad, r.realizedUsd, displayCcy, fxRate);
        if(v!==null) realized += v;
      });
      (d.holdings||[]).forEach(h=>{
        openPositions += 1;
        unrealized += convert(h.unrealized, h.unrealizedCcy, displayCcy, fxRate) || 0;
        marketValue += convert(h.marketValue, h.marketValueCcy, displayCcy, fxRate) || 0;
      });
      (d.cash||[]).forEach(c=>{
        cash += convert(c.amount, c.ccy, displayCcy, fxRate) || 0;
      });
      (d.activity||[]).forEach(a=>{
        if(a.type === 'MoneyMovement'){
          contributions += convert(a.netCash, a.ccy, displayCcy, fxRate) || 0;
        }
      });
    });
    const accountValue = marketValue + cash;
    const returnPct = contributions > 0 ? ((accountValue - contributions) / contributions) * 100 : null;
    return {realized, unrealized, marketValue, cash, accountValue, openPositions, total: realized+unrealized, contributions, returnPct};
  }, [data, displayCcy, fxRate]);

  const hasAnyData = Object.values(data).some(d => (d.holdings||[]).length || (d.realized||[]).length || (d.cash||[]).length);
  const hasContributions = Object.values(data).some(d => (d.activity||[]).some(a=>a.type==='MoneyMovement'));

  return (
    <div>
      <h1 className="page-title">Overview</h1>
      <p className="page-sub">{accounts.length} account{accounts.length!==1?'s':''} · combined across all accounts</p>

      {!hasAnyData && (
        <div className="empty">No data yet. Head to <b>Import</b> to load your holdings and trade history CSVs, or <b>Log a trade</b> to start tracking manually.</div>
      )}

      {hasAnyData && (
        <React.Fragment>
        <div className="headline-card">
          <div className="label">Total P&amp;L — realized + unrealized, {displayCcy}</div>
          <div className={"headline-value " + plClass(totals.total)}>{fmtMoney(totals.total, displayCcy, 0)}</div>
        </div>

        <MonthlyPnl data={data} displayCcy={displayCcy} fxRate={fxRate} />

        <div className="cards">
          <div className="card">
            <div className="label">Realized</div>
            <div className={"value " + plClass(totals.realized)}>{fmtMoney(totals.realized,displayCcy,0)}</div>
          </div>
          <div className="card">
            <div className="label">Unrealized</div>
            <div className={"value " + plClass(totals.unrealized)}>{fmtMoney(totals.unrealized,displayCcy,0)}</div>
          </div>
          <div className="card">
            <div className="label">Account value (holdings + cash)</div>
            <div className="value">{fmtMoney(totals.accountValue,displayCcy,0)}</div>
            <div className="sub">{fmtMoney(totals.marketValue,displayCcy,0)} invested · {fmtMoney(totals.cash,displayCcy,0)} cash</div>
          </div>
          <div className="card">
            <div className="label">Open positions</div>
            <div className="value">{totals.openPositions}</div>
          </div>
          {hasContributions && (
            <React.Fragment>
            <div className="card">
              <div className="label">Net contributions</div>
              <div className="value">{fmtMoney(totals.contributions,displayCcy,0)}</div>
              <div className="sub">deposits minus withdrawals</div>
            </div>
            <div className="card">
              <div className="label">Return on contributions</div>
              <div className={"value " + plClass(totals.returnPct)}>{totals.returnPct!==null ? fmt(totals.returnPct,1)+'%' : '—'}</div>
              <div className="sub">account value vs. money put in</div>
            </div>
            </React.Fragment>
          )}
        </div>

        <div className="section-head"><h2>By account</h2></div>
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Account</th><th>Positions</th><th>Realized</th><th>Unrealized</th><th>Cash</th><th>Account value</th>
            </tr></thead>
            <tbody>
              {accounts.map(a=>{
                const d = data[a.id] || {holdings:[], realized:[], cash:[]};
                const r = (d.realized||[]).reduce((s,row)=>s+(pickOrConvert(row.realizedCad,row.realizedUsd,displayCcy,fxRate)||0),0);
                const u = (d.holdings||[]).reduce((s,h)=>s+(convert(h.unrealized,h.unrealizedCcy,displayCcy,fxRate)||0),0);
                const mv = (d.holdings||[]).reduce((s,h)=>s+(convert(h.marketValue,h.marketValueCcy,displayCcy,fxRate)||0),0);
                const c = (d.cash||[]).reduce((s,row)=>s+(convert(row.amount,row.ccy,displayCcy,fxRate)||0),0);
                return (
                  <tr key={a.id}>
                    <td className="sym">{a.name}</td>
                    <td className="num">{(d.holdings||[]).length}</td>
                    <td className={"num "+plClass(r)}>{fmtMoney(r,displayCcy,0)}</td>
                    <td className={"num "+plClass(u)}>{fmtMoney(u,displayCcy,0)}</td>
                    <td className="num">{fmtMoney(c,displayCcy,0)}</td>
                    <td className="num">{fmtMoney(mv+c,displayCcy,0)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        {hasContributions && <p className="hint" style={{marginTop:'10px'}}>Return on contributions is a simple money-weighted estimate (current account value vs. total deposits minus withdrawals) — it doesn't account for when each deposit happened.</p>}
        </React.Fragment>
      )}
    </div>
  );
}

function Holdings({account, combined, d, displayCcy, fxRate, dataByAccount, updateAccount}){
  const [priceLoading, setPriceLoading] = useState(null);
  const [err, setErr] = useState('');
  const [search, setSearch] = useState('');
  const [assetFilter, setAssetFilter] = useState('ALL');
  const [view, setView] = useState('ALL'); // ALL | EXPIRING
  const [sortKey, setSortKey] = useState('symbol');
  const [sortDir, setSortDir] = useState('asc');
  const holdings = d.holdings || [];
  const cash = d.cash || [];
  let totalMv = 0, totalUnreal = 0, totalCash = 0;
  holdings.forEach(h=>{
    totalMv += convert(h.marketValue, h.marketValueCcy, displayCcy, fxRate) || 0;
    totalUnreal += convert(h.unrealized, h.unrealizedCcy, displayCcy, fxRate) || 0;
  });
  cash.forEach(c=>{ totalCash += convert(c.amount, c.ccy, displayCcy, fxRate) || 0; });

  function patchHolding(h, patch){
    const accId = h.accountId || (account && account.id);
    const accData = dataByAccount[accId] || {holdings:[]};
    const newHoldings = (accData.holdings||[]).map(x => x.id===h.id ? {...x, ...patch} : x);
    updateAccount(accId, {holdings: newHoldings});
  }

  async function refreshPrice(h){
    setErr(''); setPriceLoading(h.id);
    try{
      const p = await lookupPrice(h.symbol);
      const newPrice = p.price;
      const newCcy = p.currency || h.marketPriceCcy;
      const mult = h.secType==='OPTION' ? 100 : 1;
      const newMv = newPrice * h.qty * mult;
      const newUnreal = h.avgCost!==null ? (newPrice - h.avgCost) * h.qty * mult : h.unrealized;
      patchHolding(h, {marketPrice:newPrice, marketPriceCcy:newCcy, marketValue:newMv, marketValueCcy:newCcy, unrealized:newUnreal, unrealizedCcy:newCcy});
    }catch(e){
      setErr('Could not refresh ' + h.symbol + ': ' + e.message);
    }
    setPriceLoading(null);
  }

  function toggleSort(key){
    if(sortKey===key){ setSortDir(d=>d==='asc'?'desc':'asc'); }
    else { setSortKey(key); setSortDir(key==='dte'?'asc':'asc'); }
  }

  const withExpiry = holdings.map(h => {
    const expiry = classifyAsset(h)==='OPTION' ? parseOptionExpiry(h.symbol) : null;
    return {...h, expiry, dte: expiry!==null ? daysToExpiry(expiry) : null};
  });

  const expiringOnly = withExpiry.filter(h => h.dte !== null);

  const base = view==='EXPIRING' ? expiringOnly : withExpiry;
  const filtered = base.filter(h => {
    if(assetFilter !== 'ALL' && classifyAsset(h) !== assetFilter) return false;
    if(!search.trim()) return true;
    const s = search.trim().toLowerCase();
    return h.symbol.toLowerCase().includes(s) || (h.name||'').toLowerCase().includes(s);
  });
  const effectiveSortKey = view==='EXPIRING' ? 'dte' : sortKey;
  const effectiveSortDir = view==='EXPIRING' ? 'asc' : sortDir;
  const sorted = filtered.slice().sort((a,b)=>{
    let av, bv;
    if(effectiveSortKey==='symbol'){ av=a.symbol; bv=b.symbol; }
    else if(effectiveSortKey==='marketValue'){ av=convert(a.marketValue,a.marketValueCcy,displayCcy,fxRate)||0; bv=convert(b.marketValue,b.marketValueCcy,displayCcy,fxRate)||0; }
    else if(effectiveSortKey==='unrealized'){ av=convert(a.unrealized,a.unrealizedCcy,displayCcy,fxRate)||0; bv=convert(b.unrealized,b.unrealizedCcy,displayCcy,fxRate)||0; }
    else if(effectiveSortKey==='dte'){ av = a.dte===null?Infinity:a.dte; bv = b.dte===null?Infinity:b.dte; }
    if(typeof av==='string'){ const c = av.localeCompare(bv); return effectiveSortDir==='asc'?c:-c; }
    return effectiveSortDir==='asc' ? av-bv : bv-av;
  });

  function holdingReturnPct(h){
    const costBasis = (h.marketValue||0) - (h.unrealized||0);
    return costBasis !== 0 ? ((h.unrealized||0)/costBasis)*100 : null;
  }
  const filteredMv = sorted.reduce((s,h)=>s+(convert(h.marketValue,h.marketValueCcy,displayCcy,fxRate)||0),0);
  const filteredUnreal = sorted.reduce((s,h)=>s+(convert(h.unrealized,h.unrealizedCcy,displayCcy,fxRate)||0),0);
  const filteredCost = filteredMv - filteredUnreal;
  const filteredReturnPct = filteredCost !== 0 ? (filteredUnreal/filteredCost)*100 : null;

  return (
    <div>
      <h1 className="page-title">Holdings</h1>
      <p className="page-sub">{account ? account.name : ''} · current open positions · shown in {displayCcy}</p>

      {holdings.length===0 && cash.length===0 ? (
        <div className="empty">No holdings on file for this account yet. Import a holdings CSV, or log a buy manually.</div>
      ) : (
        <React.Fragment>
        <div className="toggle-row" style={{maxWidth:'420px'}}>
          <button className={view==='ALL'?'active':''} onClick={()=>setView('ALL')} type="button">All holdings</button>
          <button className={view==='EXPIRING'?'active':''} onClick={()=>setView('EXPIRING')} type="button">Expiring contracts{expiringOnly.length?' ('+expiringOnly.length+')':''}</button>
        </div>
        <div className="toggle-row" style={{maxWidth:'520px'}}>
          {ASSET_FILTERS.map(f => (
            <button key={f.id} className={assetFilter===f.id?'active':''} onClick={()=>setAssetFilter(f.id)} type="button">{f.label}</button>
          ))}
        </div>
        {view==='EXPIRING' && expiringOnly.length===0 && (
          <div className="empty" style={{marginBottom:'16px'}}>No open contracts with a parseable expiry date in this account.</div>
        )}
        <div className="cards">
          <div className="card">
            <div className="label">Market value ({displayCcy})</div>
            <div className="value">{fmtMoney(sorted.reduce((s,h)=>s+(convert(h.marketValue,h.marketValueCcy,displayCcy,fxRate)||0),0),displayCcy,0)}</div>
          </div>
          <div className="card">
            <div className="label">Cash ({displayCcy})</div>
            <div className="value">{fmtMoney(totalCash,displayCcy,0)}</div>
          </div>
          <div className="card">
            <div className="label">Account value ({displayCcy})</div>
            <div className="value">{fmtMoney(totalMv+totalCash,displayCcy,0)}</div>
          </div>
          <div className="card">
            <div className="label">Unrealized P&amp;L ({displayCcy})</div>
            <div className={"value "+plClass(filteredUnreal)}>{fmtMoney(filteredUnreal,displayCcy,0)}</div>
          </div>
          <div className="card">
            <div className="label">Unrealized return</div>
            <div className={"value "+plClass(filteredReturnPct)}>{filteredReturnPct!==null?fmt(filteredReturnPct,1)+'%':'—'}</div>
            <div className="sub">unrealized ÷ cost basis of these positions</div>
          </div>
        </div>
        <p className="hint" style={{marginBottom:'16px'}}>This only covers your currently open positions — gains already banked from closed trades aren't included, so it's normal for this to read negative even when you're up all-time. See Overview for your combined realized + unrealized performance.</p>
        {cash.length>0 && (
          <div className="table-wrap" style={{marginBottom:'16px'}}>
            <table>
              <thead><tr>{combined && <th>Account</th>}<th>Cash balance</th><th>Amount</th><th>In {displayCcy}</th></tr></thead>
              <tbody>
                {cash.map((c,i)=>(
                  <tr key={'cash'+i}>
                    {combined && <td className="name">{c.accountName}</td>}
                    <td className="sym">{c.ccy}</td>
                    <td className="num">{fmtMoney(c.amount,c.ccy)}</td>
                    <td className="num">{fmtMoney(convert(c.amount,c.ccy,displayCcy,fxRate),displayCcy)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        {err && <div className="hint err" style={{marginBottom:'10px'}}>{err}</div>}

        <div className="filter-row">
          <input className="search-input" placeholder="Search symbol or name…" value={search} onChange={e=>setSearch(e.target.value)} />
          <div className="sort-controls">
            <span className="hint" style={{margin:0}}>Sort:</span>
            <button className={"btn secondary sm"+(sortKey==='symbol'?' active':'')} onClick={()=>toggleSort('symbol')} disabled={view==='EXPIRING'}>Symbol{sortKey==='symbol'?(sortDir==='asc'?' ↑':' ↓'):''}</button>
            <button className={"btn secondary sm"+(sortKey==='marketValue'?' active':'')} onClick={()=>toggleSort('marketValue')} disabled={view==='EXPIRING'}>Value{sortKey==='marketValue'?(sortDir==='asc'?' ↑':' ↓'):''}</button>
            <button className={"btn secondary sm"+(sortKey==='unrealized'?' active':'')} onClick={()=>toggleSort('unrealized')} disabled={view==='EXPIRING'}>Unrealized{sortKey==='unrealized'?(sortDir==='asc'?' ↑':' ↓'):''}</button>
          </div>
        </div>

        <div className="table-wrap">
          <table>
            <thead><tr>
              {combined && <th>Account</th>}
              <th>Symbol</th><th>Name</th><th>Qty</th><th>Expiry</th><th>DTE</th><th>Avg cost</th><th>Price</th><th>Market value</th><th>Unrealized</th><th>Unrealized %</th><th>Notes</th>
              {!combined && <th></th>}
            </tr></thead>
            <tbody>
              {sorted.map(h=>(
                <tr key={h.id + (h.accountId||'')}>
                  {combined && <td className="name">{h.accountName}</td>}
                  <td className="sym">{h.symbol}{h.secType==='OPTION' && <span className="badge" style={{marginLeft:'6px'}}>OPT</span>}</td>
                  <td className="name">{h.name}</td>
                  <td className="num">{fmt(h.qty,0)}</td>
                  <td className="num">{h.expiry||'—'}</td>
                  <td className={"num"+(h.dte!==null && h.dte<=7?' loss':(h.dte!==null && h.dte<=30?'':''))} style={h.dte!==null && h.dte>7 && h.dte<=30?{color:'var(--brass)'}:undefined}>{h.dte!==null?h.dte+'d':'—'}</td>
                  <td className="num">{fmtMoney(convert(h.avgCost,h.marketValueCcy,displayCcy,fxRate),displayCcy)}</td>
                  <td className="num">{fmtMoney(convert(h.marketPrice,h.marketPriceCcy,displayCcy,fxRate),displayCcy)}</td>
                  <td className="num">{fmtMoney(convert(h.marketValue,h.marketValueCcy,displayCcy,fxRate),displayCcy)}</td>
                  <td className={"num "+plClass(h.unrealized)}>{fmtMoney(convert(h.unrealized,h.unrealizedCcy,displayCcy,fxRate),displayCcy)}</td>
                  <td className={"num "+plClass(holdingReturnPct(h))}>{holdingReturnPct(h)!==null?fmt(holdingReturnPct(h),1)+'%':'—'}</td>
                  <td>
                    <input className="notes-input" defaultValue={h.notes||''} placeholder="—"
                      onBlur={e=>{ if(e.target.value !== (h.notes||'')) patchHolding(h, {notes:e.target.value}); }} />
                  </td>
                  {!combined && (
                    <td>
                      <button className="btn secondary sm" disabled={priceLoading===h.id} onClick={()=>refreshPrice(h)}>
                        {priceLoading===h.id ? <span className="spinner"></span> : 'Refresh price'}
                      </button>
                    </td>
                  )}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        </React.Fragment>
      )}
    </div>
  );
}

function History({account, combined, d, displayCcy, fxRate, dataByAccount, updateAccount}){
  const [search, setSearch] = useState('');
  const [assetFilter, setAssetFilter] = useState('ALL');
  const [timeFilter, setTimeFilter] = useState('ALL');
  const [sortKey, setSortKey] = useState('date');
  const [sortDir, setSortDir] = useState('desc');
  const all = d.realized || [];

  function patchRealized(r, patch){
    const accId = r.accountId || (account && account.id);
    const accData = dataByAccount[accId] || {realized:[]};
    const newRealized = (accData.realized||[]).map(x => x.id===r.id ? {...x, ...patch} : x);
    updateAccount(accId, {realized: newRealized});
  }

  function toggleSort(key){
    if(sortKey===key){ setSortDir(dd=>dd==='asc'?'desc':'asc'); }
    else { setSortKey(key); setSortDir(key==='date'?'desc':'asc'); }
  }

  const filtered = all.filter(r => {
    if(assetFilter !== 'ALL' && classifyAsset(r) !== assetFilter) return false;
    if(!withinTimeFilter(r.date, timeFilter)) return false;
    if(!search.trim()) return true;
    const s = search.trim().toLowerCase();
    return r.symbol.toLowerCase().includes(s) || (r.name||'').toLowerCase().includes(s);
  });
  const realized = filtered.slice().sort((a,b)=>{
    let av, bv;
    if(sortKey==='date'){ av=a.date||''; bv=b.date||''; }
    else if(sortKey==='symbol'){ av=a.symbol; bv=b.symbol; }
    else if(sortKey==='realized'){ av=pickOrConvert(a.realizedCad,a.realizedUsd,displayCcy,fxRate)||0; bv=pickOrConvert(b.realizedCad,b.realizedUsd,displayCcy,fxRate)||0; }
    if(typeof av==='string'){ const c = av.localeCompare(bv); return sortDir==='asc'?c:-c; }
    return sortDir==='asc' ? av-bv : bv-av;
  });
  const total = realized.reduce((s,r)=>s+(pickOrConvert(r.realizedCad,r.realizedUsd,displayCcy,fxRate)||0),0);
  const totalCostBasis = realized.reduce((s,r)=>s+Math.abs(pickOrConvert(r.initialInvCad,r.initialInvUsd,displayCcy,fxRate)||0),0);
  const totalProceeds = realized.reduce((s,r)=>s+(pickOrConvert(r.netProceedsCad,r.netProceedsUsd,displayCcy,fxRate)||0),0);
  const totalReturnPct = totalCostBasis !== 0 ? (total/totalCostBasis)*100 : null;
  const netDeposits = computeNetDeposits(d.activity, displayCcy, fxRate);
  const netDepositReturnPct = netDeposits > 0 ? (total/netDeposits)*100 : null;

  return (
    <div>
      <h1 className="page-title">Trade history</h1>
      <p className="page-sub">{account?account.name:''} · closed / realized trades · shown in {displayCcy}</p>
      {all.length===0 ? (
        <div className="empty">No realized trades yet for this account. Import a realized gain/loss report, or log a sell.</div>
      ) : (
        <React.Fragment>
        <div className="toggle-row" style={{maxWidth:'420px'}}>
          {TIME_FILTERS.map(f => (
            <button key={f.id} className={timeFilter===f.id?'active':''} onClick={()=>setTimeFilter(f.id)} type="button">{f.label}</button>
          ))}
        </div>
        <div className="toggle-row" style={{maxWidth:'520px'}}>
          {ASSET_FILTERS.map(f => (
            <button key={f.id} className={assetFilter===f.id?'active':''} onClick={()=>setAssetFilter(f.id)} type="button">{f.label}</button>
          ))}
        </div>

        <div className="cards">
          <div className="card"><div className="label">Closed trades</div><div className="value">{realized.length}</div></div>
          <div className="card"><div className="label">Risked (cost basis, per trade, summed)</div><div className="value">{fmtMoney(totalCostBasis,displayCcy,0)}</div></div>
          <div className="card"><div className="label">Returned (proceeds)</div><div className="value">{fmtMoney(totalProceeds,displayCcy,0)}</div></div>
          <div className="card">
            <div className="label">Profit</div>
            <div className={"value "+plClass(total)}>{fmtMoney(total,displayCcy,0)}</div>
            <div className="sub">{totalReturnPct!==null?fmt(totalReturnPct,1)+'% of risked':''}</div>
          </div>
          <div className="card"><div className="label">Deposited</div><div className="value">{fmtMoney(netDeposits,displayCcy,0)}</div></div>
          <div className="card">
            <div className="label">Profit vs. deposits</div>
            <div className={"value "+plClass(total)}>{fmtMoney(total,displayCcy,0)}</div>
            <div className="sub">{netDepositReturnPct!==null?fmt(netDepositReturnPct,1)+'% of deposits':''}</div>
          </div>
        </div>

        <div className="filter-row">
          <input className="search-input" placeholder="Search symbol or name…" value={search} onChange={e=>setSearch(e.target.value)} />
          <div className="sort-controls">
            <span className="hint" style={{margin:0}}>Sort:</span>
            <button className={"btn secondary sm"+(sortKey==='date'?' active':'')} onClick={()=>toggleSort('date')}>Date{sortKey==='date'?(sortDir==='asc'?' ↑':' ↓'):''}</button>
            <button className={"btn secondary sm"+(sortKey==='symbol'?' active':'')} onClick={()=>toggleSort('symbol')}>Symbol{sortKey==='symbol'?(sortDir==='asc'?' ↑':' ↓'):''}</button>
            <button className={"btn secondary sm"+(sortKey==='realized'?' active':'')} onClick={()=>toggleSort('realized')}>Realized{sortKey==='realized'?(sortDir==='asc'?' ↑':' ↓'):''}</button>
          </div>
        </div>

        {realized.length===0 ? (
          <div className="empty">No trades match this filter.</div>
        ) : (
        <div className="table-wrap">
          <table>
            <thead><tr>
              <th>Date</th>{combined && <th>Account</th>}<th>Symbol</th><th>Name</th><th>Proceeds</th><th>Cost</th><th>Realized</th><th>Return</th><th>Notes</th>
            </tr></thead>
            <tbody>
              {realized.map(r=>{
                const proceeds = pickOrConvert(r.netProceedsCad, r.netProceedsUsd, displayCcy, fxRate);
                const cost = pickOrConvert(r.initialInvCad, r.initialInvUsd, displayCcy, fxRate);
                const gain = pickOrConvert(r.realizedCad, r.realizedUsd, displayCcy, fxRate);
                const returnPct = (cost && cost!==0) ? (gain/Math.abs(cost))*100 : null;
                return (
                  <tr key={r.id + (r.accountId||'')}>
                    <td>{r.date}</td>
                    {combined && <td className="name">{r.accountName}</td>}
                    <td className="sym">{r.symbol}</td>
                    <td className="name">{r.name}</td>
                    <td className="num">{fmtMoney(proceeds,'')}</td>
                    <td className="num">{fmtMoney(cost,'')}</td>
                    <td className={"num "+plClass(gain)}>{fmtMoney(gain,'')}</td>
                    <td className={"num "+plClass(returnPct)}>{returnPct!==null?fmt(returnPct,1)+'%':'—'}</td>
                    <td>
                      <input className="notes-input" defaultValue={r.notes||''} placeholder="—"
                        onBlur={e=>{ if(e.target.value !== (r.notes||'')) patchRealized(r, {notes:e.target.value}); }} />
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        )}
        </React.Fragment>
      )}
    </div>
  );
}

function Stats({account, d, displayCcy, fxRate}){
  const [assetFilter, setAssetFilter] = useState('ALL');
  const [timeFilter, setTimeFilter] = useState('ALL');
  const trades = useMemo(() => {
    const all = d.realized || [];
    return all.filter(r => (assetFilter==='ALL' || classifyAsset(r)===assetFilter) && withinTimeFilter(r.date, timeFilter));
  }, [d.realized, assetFilter, timeFilter]);
  const netDeposits = useMemo(() => computeNetDeposits(d.activity, displayCcy, fxRate), [d.activity, displayCcy, fxRate]);
  const stats = useMemo(() => {
    const withPl = trades.map(r => {
      const pl = pickOrConvert(r.realizedCad, r.realizedUsd, displayCcy, fxRate);
      const cost = pickOrConvert(r.initialInvCad, r.initialInvUsd, displayCcy, fxRate);
      const returnPct = (pl!==null && cost && cost!==0) ? (pl/Math.abs(cost))*100 : null;
      return {...r, pl, returnPct};
    }).filter(r => r.pl !== null);
    const wins = withPl.filter(r => r.pl > 0);
    const losses = withPl.filter(r => r.pl < 0);
    const flat = withPl.filter(r => r.pl === 0);
    const sumWins = wins.reduce((s,r)=>s+r.pl,0);
    const sumLosses = losses.reduce((s,r)=>s+r.pl,0);
    const totalPl = sumWins + sumLosses;
    const avgWin = wins.length ? sumWins/wins.length : 0;
    const avgLoss = losses.length ? sumLosses/losses.length : 0;
    const winRate = withPl.length ? (wins.length/withPl.length)*100 : 0;
    const profitFactor = sumLosses !== 0 ? Math.abs(sumWins/sumLosses) : null;
    const withReturnPct = withPl.filter(r => r.returnPct !== null);
    const avgReturnPct = withReturnPct.length ? withReturnPct.reduce((s,r)=>s+r.returnPct,0)/withReturnPct.length : null;
    const totalCostBasis = withPl.reduce((s,r)=>s+Math.abs(pickOrConvert(r.initialInvCad,r.initialInvUsd,displayCcy,fxRate)||0),0);
    const totalProceeds = withPl.reduce((s,r)=>s+(pickOrConvert(r.netProceedsCad,r.netProceedsUsd,displayCcy,fxRate)||0),0);
    const aggregateReturnPct = totalCostBasis !== 0 ? (totalPl/totalCostBasis)*100 : null;
    const netDepositReturnPct = netDeposits > 0 ? (totalPl/netDeposits)*100 : null;
    const sorted = withPl.slice().sort((a,b)=>b.pl-a.pl);
    const best = sorted.slice(0,5);
    const worst = sorted.slice(-5).reverse();
    const bySymbol = {};
    withPl.forEach(r => {
      const cost = Math.abs(pickOrConvert(r.initialInvCad, r.initialInvUsd, displayCcy, fxRate) || 0);
      if(!bySymbol[r.symbol]) bySymbol[r.symbol] = {symbol: r.symbol, pl: 0, cost: 0, count: 0};
      bySymbol[r.symbol].pl += r.pl;
      bySymbol[r.symbol].cost += cost;
      bySymbol[r.symbol].count += 1;
    });
    const symbolRows = Object.values(bySymbol)
      .map(row => ({...row, returnPct: row.cost !== 0 ? (row.pl/row.cost)*100 : null}))
      .sort((a,b)=>b.pl-a.pl);
    return {total: withPl.length, wins, losses, flat, totalPl, avgWin, avgLoss, winRate, profitFactor, avgReturnPct, aggregateReturnPct, netDepositReturnPct, totalCostBasis, totalProceeds, best, worst, symbolRows};
  }, [trades, displayCcy, fxRate, netDeposits]);

  const hasAnyTrades = (d.realized||[]).length > 0;

  return (
    <div>
      <h1 className="page-title">Stats</h1>
      <p className="page-sub">{account?account.name:''} · performance on closed trades · shown in {displayCcy}</p>

        <React.Fragment>
        <div className="toggle-row" style={{maxWidth:'420px'}}>
