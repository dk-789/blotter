            <button key={f.id} className={timeFilter===f.id?'active':''} onClick={()=>setTimeFilter(f.id)} type="button">{f.label}</button>
          ))}
        </div>
        <div className="toggle-row" style={{maxWidth:'520px'}}>
          {ASSET_FILTERS.map(f => (
            <button key={f.id} className={assetFilter===f.id?'active':''} onClick={()=>setAssetFilter(f.id)} type="button">{f.label}</button>
          ))}
        </div>
        </React.Fragment>
      )}

      {stats.total===0 ? (
        <div className="empty">{hasAnyTrades ? 'No closed trades match this filter.' : 'No closed trades yet to compute stats from.'}</div>
      ) : (
        <React.Fragment>
        <div className="headline-card">
          <div className="label">Total P&amp;L on {stats.total} closed trade{stats.total!==1?'s':''}</div>
          <div className={"headline-value "+plClass(stats.totalPl)}>{fmtMoney(stats.totalPl,displayCcy,0)}</div>
        </div>
        <div className="cards">
          <div className="card"><div className="label">Win rate</div><div className="value">{fmt(stats.winRate,0)}%</div><div className="sub">{stats.wins.length}W · {stats.losses.length}L{stats.flat.length?(' · '+stats.flat.length+' flat'):''}</div></div>
          <div className="card"><div className="label">Avg win</div><div className="value gain">{fmtMoney(stats.avgWin,displayCcy,0)}</div></div>
          <div className="card"><div className="label">Avg loss</div><div className="value loss">{fmtMoney(stats.avgLoss,displayCcy,0)}</div></div>
          <div className="card"><div className="label">Profit factor</div><div className="value">{stats.profitFactor!==null?fmt(stats.profitFactor,2):'—'}</div><div className="sub">gross wins ÷ gross losses</div></div>
          <div className="card"><div className="label">Avg return per trade</div><div className={"value "+plClass(stats.avgReturnPct)}>{stats.avgReturnPct!==null?fmt(stats.avgReturnPct,1)+'%':'—'}</div></div>
          <div className="card"><div className="label">Risked (cost basis, per trade, summed)</div><div className="value">{fmtMoney(stats.totalCostBasis,displayCcy,0)}</div></div>
          <div className="card"><div className="label">Returned (proceeds)</div><div className="value">{fmtMoney(stats.totalProceeds,displayCcy,0)}</div></div>
          <div className="card">
            <div className="label">Profit</div>
            <div className={"value "+plClass(stats.totalPl)}>{fmtMoney(stats.totalPl,displayCcy,0)}</div>
            <div className="sub">{stats.aggregateReturnPct!==null?fmt(stats.aggregateReturnPct,1)+'% of risked':''}</div>
          </div>
          <div className="card"><div className="label">Deposited</div><div className="value">{fmtMoney(netDeposits,displayCcy,0)}</div></div>
          <div className="card">
            <div className="label">Profit vs. deposits</div>
            <div className={"value "+plClass(stats.totalPl)}>{fmtMoney(stats.totalPl,displayCcy,0)}</div>
            <div className="sub">{stats.netDepositReturnPct!==null?fmt(stats.netDepositReturnPct,1)+'% of deposits':''}</div>
          </div>
        </div>
        <p className="hint" style={{marginBottom:'16px'}}>"Risked" sums up what was put into each individual trade (its own cost basis), not your whole account — it can add up to more than you've ever deposited, since the same capital gets reused each time you close a trade and open a new one. "Deposited" is the real money you've put into the account all-time instead.</p>

        <div className="section-head"><h2>Best trades</h2></div>
        <div className="table-wrap" style={{marginBottom:'20px'}}>
          <table>
            <thead><tr><th>Date</th><th>Symbol</th><th>Name</th><th>Realized</th><th>Return</th></tr></thead>
            <tbody>
              {stats.best.map(r=>(
                <tr key={'best'+r.id}>
                  <td>{r.date}</td><td className="sym">{r.symbol}</td><td className="name">{r.name}</td>
                  <td className={"num "+plClass(r.pl)}>{fmtMoney(r.pl,displayCcy,0)}</td>
                  <td className={"num "+plClass(r.returnPct)}>{r.returnPct!==null?fmt(r.returnPct,1)+'%':'—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="section-head"><h2>Worst trades</h2></div>
        <div className="table-wrap" style={{marginBottom:'20px'}}>
          <table>
            <thead><tr><th>Date</th><th>Symbol</th><th>Name</th><th>Realized</th><th>Return</th></tr></thead>
            <tbody>
              {stats.worst.map(r=>(
                <tr key={'worst'+r.id}>
                  <td>{r.date}</td><td className="sym">{r.symbol}</td><td className="name">{r.name}</td>
                  <td className={"num "+plClass(r.pl)}>{fmtMoney(r.pl,displayCcy,0)}</td>
                  <td className={"num "+plClass(r.returnPct)}>{r.returnPct!==null?fmt(r.returnPct,1)+'%':'—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>

        <div className="section-head"><h2>By symbol</h2></div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Symbol</th><th>Trades</th><th>Amount put in</th><th>Profit</th><th>Return</th></tr></thead>
            <tbody>
              {stats.symbolRows.map(row=>(
                <tr key={'sym'+row.symbol}>
                  <td className="sym">{row.symbol}</td>
                  <td className="num">{row.count}</td>
                  <td className="num">{fmtMoney(row.cost,displayCcy,0)}</td>
                  <td className={"num "+plClass(row.pl)}>{fmtMoney(row.pl,displayCcy,0)}</td>
                  <td className={"num "+plClass(row.returnPct)}>{row.returnPct!==null?fmt(row.returnPct,1)+'%':'—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        </React.Fragment>
      )}
    </div>
  );
}

function buildOptionSymbol(underlying, expiry, strike, right){
  if(!underlying || !expiry || !strike) return '';
  const d = new Date(expiry + 'T00:00:00');
  const dd = String(d.getDate()).padStart(2,'0');
  const mon = d.toLocaleString('en-US',{month:'short'}).toUpperCase();
  const yy = String(d.getFullYear()).slice(2);
  return underlying.trim().toUpperCase() + ' ' + dd + mon + yy + ' ' + strike + (right==='CALL'?'C':'P');
}

function daysToExpiry(expiry){
  if(!expiry) return null;
  const now = new Date();
  const exp = new Date(expiry + 'T00:00:00');
  return Math.round((exp - now) / (1000*60*60*24));
}

// ---- Black-Scholes pricing (European-style approximation; retail long
// calls/puts price close enough to this for estimation purposes) ----
function erf(x){
  const sign = x < 0 ? -1 : 1;
  x = Math.abs(x);
  const a1=0.254829592, a2=-0.284496736, a3=1.421413741, a4=-1.453152027, a5=1.061405429, p=0.3275911;
  const t = 1/(1+p*x);
  const y = 1 - (((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-x*x);
  return sign*y;
}
function normCDF(x){ return 0.5*(1+erf(x/Math.sqrt(2))); }
function bsPrice(S, K, T, r, sigma, type){
  if(T <= 0 || sigma <= 0) return Math.max(0, type==='CALL' ? S-K : K-S);
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*Math.sqrt(T));
  const d2 = d1 - sigma*Math.sqrt(T);
  return type==='CALL'
    ? S*normCDF(d1) - K*Math.exp(-r*T)*normCDF(d2)
    : K*Math.exp(-r*T)*normCDF(-d2) - S*normCDF(-d1);
}
function bsDelta(S, K, T, r, sigma, type){
  if(T <= 0 || sigma <= 0) return type==='CALL' ? (S>K?1:0) : (S<K?-1:0);
  const d1 = (Math.log(S/K) + (r + sigma*sigma/2)*T) / (sigma*Math.sqrt(T));
  return type==='CALL' ? normCDF(d1) : normCDF(d1)-1;
}
// Solves for the implied volatility that reproduces the given market price,
// by bisection over a wide vol range — the same quantity your broker's
// options screen shows as "IV", derived here from your own contract's inputs.
function impliedVol(price, S, K, T, r, type){
  if(T <= 0) return null;
  const intrinsic = Math.max(0, type==='CALL' ? S-K : K-S);
  if(price <= intrinsic) return 0;
  let lo = 0.001, hi = 5.0;
  for(let i=0; i<100; i++){
    const mid = (lo+hi)/2;
    const p = bsPrice(S, K, T, r, mid, type);
    if(p > price) hi = mid; else lo = mid;
  }
  return (lo+hi)/2;
}

function PositionSizer({account, d, displayCcy, fxRate}){
  const [underlying, setUnderlying] = useState('');
  const [expiry, setExpiry] = useState('');
  const [strike, setStrike] = useState('');
  const [right, setRight] = useState('CALL');
  const [premium, setPremium] = useState('');
  const [premiumCcy, setPremiumCcy] = useState('USD');
  const [riskPct, setRiskPct] = useState('2');
  const [stopLossPct, setStopLossPct] = useState('100');
  const [underlyingPrice, setUnderlyingPrice] = useState('');
  const [priceLoading, setPriceLoading] = useState(false);
  const [priceMsg, setPriceMsg] = useState(null);
  const [targetPrice, setTargetPrice] = useState('');
  const [targetDate, setTargetDate] = useState('');
  const [ivOverride, setIvOverride] = useState('');
  const [riskFreeRatePct, setRiskFreeRatePct] = useState('4.5');

  const holdings = d.holdings || [];
  const cashRows = d.cash || [];
  const portfolioEquity = holdings.reduce((s,h)=>s+(convert(h.marketValue,h.marketValueCcy,displayCcy,fxRate)||0),0)
    + cashRows.reduce((s,c)=>s+(convert(c.amount,c.ccy,displayCcy,fxRate)||0),0);
  const cashAvailable = cashRows.reduce((s,c)=>s+(convert(c.amount,c.ccy,displayCcy,fxRate)||0),0);

  const optionSymbol = buildOptionSymbol(underlying, expiry, strike, right);
  const dte = daysToExpiry(expiry);
  const premiumNum = parseFloat(premium);
  const strikeNum = parseFloat(strike);
  const riskPctNum = parseFloat(riskPct);
  const stopLossPctNum = parseFloat(stopLossPct);
  const underlyingPriceNum = parseFloat(underlyingPrice);
  const hasInputs = premiumNum > 0 && riskPctNum > 0 && stopLossPctNum > 0;

  function sizeAt(pct){
    if(!hasInputs) return null;
    const premiumPerContract = convert(premiumNum, premiumCcy, displayCcy, fxRate) * 100;
    const maxLossPerContract = premiumPerContract * (stopLossPctNum/100);
    const maxDollarRisk = portfolioEquity * (pct/100);
    const contractsByRisk = maxLossPerContract > 0 ? Math.floor(maxDollarRisk / maxLossPerContract) : 0;
    const contractsByCash = premiumPerContract > 0 ? Math.floor(cashAvailable / premiumPerContract) : 0;
    const contracts = Math.min(contractsByRisk, contractsByCash);
    const totalCost = contracts * premiumPerContract;
    const dollarAtRisk = contracts * maxLossPerContract;
    const cappedByCash = contractsByCash < contractsByRisk;
    return {contracts, totalCost, dollarAtRisk, contractsByRisk, contractsByCash, cappedByCash, premiumPerContract};
  }

  const main = hasInputs ? sizeAt(riskPctNum) : null;
  const reference = hasInputs ? [1, 2, 5, 10].map(pct => ({pct, ...sizeAt(pct)})) : [];

  // ---- Portfolio heat: total exposure already sitting in open options ----
  const optionHoldings = holdings.filter(h => classifyAsset(h) === 'OPTION');
  const currentOptionsExposure = optionHoldings.reduce((s,h)=>s+(convert(h.marketValue,h.marketValueCcy,displayCcy,fxRate)||0),0);
  const currentHeatPct = portfolioEquity > 0 ? (currentOptionsExposure/portfolioEquity)*100 : null;
  const projectedExposure = currentOptionsExposure + (main ? main.totalCost : 0);
  const projectedHeatPct = portfolioEquity > 0 ? (projectedExposure/portfolioEquity)*100 : null;

  // ---- Breakeven & required move ----
  async function handleLookupUnderlying(){
    if(!underlying.trim()){ setPriceMsg({type:'err', text:'Enter the underlying ticker first.'}); return; }
    setPriceLoading(true); setPriceMsg(null);
    try{
      const p = await lookupPrice(underlying.trim().toUpperCase());
      setUnderlyingPrice(String(p.price));
      if(p.currency) setPremiumCcy(p.currency);
      setPriceMsg({type:'ok', text: underlying.trim().toUpperCase() + ' trading at ' + fmtMoney(p.price, p.currency||premiumCcy) + ' as of ' + (p.asOf||'now') + '.'});
    }catch(e){
      setPriceMsg({type:'err', text:e.message});
    }
    setPriceLoading(false);
  }
  const hasBreakevenInputs = premiumNum > 0 && strikeNum > 0 && underlyingPriceNum > 0;
  const breakeven = hasBreakevenInputs ? (right==='CALL' ? strikeNum+premiumNum : strikeNum-premiumNum) : null;
  const requiredMovePct = (hasBreakevenInputs && underlyingPriceNum>0) ? ((breakeven-underlyingPriceNum)/underlyingPriceNum)*100 : null;
  const needsToRise = requiredMovePct !== null && requiredMovePct > 0;

  // ---- Implied volatility, solved from your own premium + contract details ----
  const T = dte !== null && dte > 0 ? dte/365 : 0;
  const riskFreeRate = (parseFloat(riskFreeRatePct)||0)/100;
  const solvedIV = (hasBreakevenInputs && T > 0)
    ? impliedVol(premiumNum, underlyingPriceNum, strikeNum, T, riskFreeRate, right)
    : null;
  const ivOverrideNum = parseFloat(ivOverride);
  const effectiveIV = (ivOverrideNum > 0) ? ivOverrideNum/100 : solvedIV;
  const currentDelta = (hasBreakevenInputs && T > 0 && effectiveIV > 0)
    ? bsDelta(underlyingPriceNum, strikeNum, T, riskFreeRate, effectiveIV, right)
    : null;

  // ---- Scenario: estimated value if underlying hits a target price by a target date ----
  // Priced with Black-Scholes using the implied volatility solved above, held constant
  // at today's level — the standard estimation approach, but real IV moves with market
  // conditions and news, so treat this as a model estimate, not a guaranteed quote.
  const targetPriceNum = parseFloat(targetPrice);
  const hasScenarioInputs = hasBreakevenInputs && effectiveIV > 0 && targetPriceNum > 0 && targetDate && dte !== null && dte > 0;
  let scenario = null;
  if(hasScenarioInputs){
    const daysFromNow = Math.round((new Date(targetDate+'T00:00:00') - new Date()) / (1000*60*60*24));
    const daysRemainingAtTarget = Math.max(0, dte - Math.max(0, daysFromNow));
    const tTarget = daysRemainingAtTarget/365;
    const estimatedPremium = bsPrice(targetPriceNum, strikeNum, tTarget, riskFreeRate, effectiveIV, right);
    const pnlPerShare = estimatedPremium - premiumNum;
    const contractsForScenario = main && main.contracts > 0 ? main.contracts : 1;
    const pnlTotal = convert(pnlPerShare, premiumCcy, displayCcy, fxRate) * 100 * contractsForScenario;
    const returnPct = premiumNum > 0 ? (pnlPerShare/premiumNum)*100 : null;
    scenario = {estimatedPremium, pnlPerShare, pnlTotal, returnPct, daysFromNow, daysRemainingAtTarget, contractsForScenario};
  }

  return (
    <div>
      <h1 className="page-title">Position sizer</h1>
      <p className="page-sub">{account?account.name:''} · how many contracts fits your risk rule · shown in {displayCcy}</p>

      <div className="cards" style={{marginBottom:'20px'}}>
        <div className="card">
          <div className="label">Portfolio equity ({displayCcy})</div>
          <div className="value">{fmtMoney(portfolioEquity,displayCcy,0)}</div>
          <div className="sub">holdings + cash, this account</div>
        </div>
        <div className="card">
          <div className="label">Cash available ({displayCcy})</div>
          <div className="value">{fmtMoney(cashAvailable,displayCcy,0)}</div>
        </div>
        <div className="card">
          <div className="label">Current options exposure</div>
          <div className="value">{fmtMoney(currentOptionsExposure,displayCcy,0)}</div>
          <div className="sub">{currentHeatPct!==null?fmt(currentHeatPct,1)+'% of portfolio':'—'} · {optionHoldings.length} open position{optionHoldings.length!==1?'s':''}</div>
        </div>
      </div>

      <form className="form" onSubmit={e=>e.preventDefault()}>
        <div className="form-row">
          <div className="form-field">
            <label>Underlying ticker</label>
            <input value={underlying} onChange={e=>setUnderlying(e.target.value)} placeholder="e.g. TSLA" />
          </div>
          <div className="form-field">
            <label>Expiry</label>
            <input type="date" value={expiry} onChange={e=>setExpiry(e.target.value)} />
          </div>
        </div>
        <div className="form-row">
          <div className="form-field">
            <label>Strike</label>
            <input type="number" step="any" value={strike} onChange={e=>setStrike(e.target.value)} placeholder="e.g. 300" />
          </div>
          <div className="form-field" style={{maxWidth:'120px'}}>
            <label>Right</label>
            <select value={right} onChange={e=>setRight(e.target.value)}>
              <option value="CALL">Call</option>
              <option value="PUT">Put</option>
            </select>
          </div>
        </div>
        {optionSymbol && (
          <div className="hint">
            {optionSymbol}{dte!==null && (dte>=0 ? (' — ' + dte + ' days to expiry') : ' — already expired')}
          </div>
        )}
        <div className="form-row" style={{marginTop:'12px'}}>
          <div className="form-field">
            <label>Premium per share (quote)</label>
            <input type="number" step="any" value={premium} onChange={e=>setPremium(e.target.value)} placeholder="e.g. 5.00" />
          </div>
          <div className="form-field" style={{maxWidth:'90px'}}>
            <label>Currency</label>
            <select value={premiumCcy} onChange={e=>setPremiumCcy(e.target.value)}>
              <option>USD</option><option>CAD</option>
            </select>
          </div>
        </div>
        <div className="form-row">
          <div className="form-field">
            <label>Underlying's current price</label>
            <div className="inline-btn">
              <input type="number" step="any" value={underlyingPrice} onChange={e=>setUnderlyingPrice(e.target.value)} placeholder="e.g. 285.00" />
              <button type="button" className="btn secondary sm" disabled={priceLoading} onClick={handleLookupUnderlying}>
                {priceLoading ? <span className="spinner"></span> : 'Look up'}
              </button>
            </div>
          </div>
        </div>
        {priceMsg && <div className={"hint " + (priceMsg.type==='err'?'err':'ok')}>{priceMsg.text}</div>}
        <div className="form-row" style={{marginTop:'12px'}}>
          <div className="form-field">
            <label>Risk per trade (% of portfolio equity)</label>
            <input type="number" step="any" value={riskPct} onChange={e=>setRiskPct(e.target.value)} placeholder="2" />
          </div>
          <div className="form-field">
            <label>Max loss at exit (% of premium)</label>
            <input type="number" step="any" value={stopLossPct} onChange={e=>setStopLossPct(e.target.value)} placeholder="100" />
          </div>
        </div>
        <div className="hint" style={{marginBottom:'0'}}>Leave "max loss at exit" at 100% for a plain long call/put you'd hold to expiry or zero — it can lose the whole premium. Lower it if you plan to cut the trade at a defined stop (e.g. 50% means you'll exit once you're down half the premium).</div>
      </form>

      {!hasInputs ? (
        <div className="empty" style={{marginTop:'16px'}}>Enter a premium, risk %, and max-loss % above to see a sizing recommendation.</div>
      ) : (
        <React.Fragment>
        <div className="headline-card" style={{marginTop:'20px'}}>
          <div className="label">Recommended size at {riskPctNum}% risk</div>
          <div className="headline-value">{main.contracts} contract{main.contracts!==1?'s':''}</div>
          <div className="sub" style={{marginTop:'8px'}}>
            {fmtMoney(main.totalCost,displayCcy,0)} total cost · {fmtMoney(main.dollarAtRisk,displayCcy,0)} at risk
            {main.cappedByCash && main.contracts < main.contractsByRisk ? ' · capped by available cash, not your risk rule' : ''}
          </div>
        </div>

        {main.contracts === 0 && (
          <div className="hint err" style={{marginBottom:'16px'}}>
            {main.contractsByCash === 0 ? "You don't have enough cash in this account to buy even one contract at this premium." : "Your risk rule allows less than one contract's worth of loss — either raise the risk %, or this position doesn't fit your rule at this size."}
          </div>
        )}

        <div className="section-head"><h2>How size scales with risk tolerance</h2></div>
        <div className="table-wrap">
          <table>
            <thead><tr><th>Risk level</th><th>Contracts</th><th>Total cost</th><th>$ at risk</th><th>% of portfolio</th></tr></thead>
            <tbody>
              {reference.map(row => (
                <tr key={row.pct}>
                  <td className="sym">{row.pct}%{row.pct===riskPctNum ? ' (your setting)' : ''}</td>
                  <td className="num">{row.contracts}</td>
                  <td className="num">{fmtMoney(row.totalCost,displayCcy,0)}</td>
                  <td className="num">{fmtMoney(row.dollarAtRisk,displayCcy,0)}</td>
                  <td className="num">{portfolioEquity>0 ? fmt(row.totalCost/portfolioEquity*100,1)+'%' : '—'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
        <p className="hint" style={{marginTop:'10px', marginBottom:'20px'}}>
          Most professional risk managers cap any single trade at 1-2% of total account equity; more aggressive discretionary traders sometimes run 5%, and going past that on one options position is generally considered concentrated / high-risk. This tool takes whichever is smaller — your risk-based limit or what you can actually afford in cash — so it never recommends a size you can't pay for.
        </p>

        <div className="section-head"><h2>Portfolio heat if you add this trade</h2></div>
        <div className="cards" style={{marginBottom:'8px'}}>
          <div className="card">
            <div className="label">Options exposure now</div>
            <div className="value">{fmtMoney(currentOptionsExposure,displayCcy,0)}</div>
            <div className="sub">{currentHeatPct!==null?fmt(currentHeatPct,1)+'% of portfolio':'—'}</div>
          </div>
          <div className="card">
            <div className="label">Options exposure after this trade</div>
            <div className={"value "+(projectedHeatPct!==null && projectedHeatPct>25 ? 'loss':'')}>{fmtMoney(projectedExposure,displayCcy,0)}</div>
            <div className="sub">{projectedHeatPct!==null?fmt(projectedHeatPct,1)+'% of portfolio':'—'}</div>
          </div>
        </div>
        <p className="hint" style={{marginBottom:'20px'}}>
          This is your total worst-case exposure across every open option position if they all went to zero, including this one. There's no universal rule, but many traders get uncomfortable once total options exposure (as distinct from any single trade) climbs past roughly 20-25% of the portfolio — it stops being "a few sized bets" and starts being a leveraged bet on the whole book.
        </p>

        <div className="section-head"><h2>Breakeven &amp; required move</h2></div>
        {!hasBreakevenInputs ? (
          <div className="empty" style={{marginBottom:'20px'}}>Enter the strike and look up the underlying's current price to see the breakeven.</div>
        ) : (
          <React.Fragment>
          <div className="cards" style={{marginBottom:'8px'}}>
            <div className="card">
              <div className="label">Breakeven price</div>
              <div className="value">{fmtMoney(breakeven, premiumCcy)}</div>
            </div>
            <div className="card">
              <div className="label">Required move</div>
              <div className="value">{fmt(Math.abs(requiredMovePct),1)}% {needsToRise?'up':'down'}</div>
              <div className="sub">from {fmtMoney(underlyingPriceNum,premiumCcy)} by expiry{dte!==null?(' ('+dte+'d)'):''}</div>
            </div>
            <div className="card">
              <div className="label">Implied volatility</div>
              <div className="value">{effectiveIV>0 ? fmt(effectiveIV*100,1)+'%' : '—'}</div>
              <div className="sub">{ivOverrideNum>0 ? 'your override' : (solvedIV!==null ? 'solved from your premium' : '—')}</div>
            </div>
            {currentDelta !== null && (
              <div className="card">
                <div className="label">Delta</div>
                <div className="value">{fmt(currentDelta,2)}</div>
                <div className="sub">~${fmt(Math.abs(currentDelta)*100,0)} move per $1 in the underlying, per contract</div>
              </div>
            )}
          </div>
          <div className="form-row" style={{maxWidth:'420px', marginBottom:'8px'}}>
            <div className="form-field">
              <label>Use a different IV instead (e.g. from your broker)</label>
              <input type="number" step="any" value={ivOverride} onChange={e=>setIvOverride(e.target.value)} placeholder={solvedIV!==null ? fmt(solvedIV*100,1)+' (solved)' : 'e.g. 45'} />
            </div>
            <div className="form-field" style={{maxWidth:'140px'}}>
              <label>Risk-free rate %</label>
              <input type="number" step="any" value={riskFreeRatePct} onChange={e=>setRiskFreeRatePct(e.target.value)} />
            </div>
          </div>
          <p className="hint" style={{marginBottom:'20px'}}>Breakeven is where the option's intrinsic value alone covers what you paid — the underlying has to move further than this for the trade to be genuinely profitable after typically also covering time value that's decayed away. The implied volatility above is solved with Black-Scholes from your premium, strike, expiry, and the underlying's price — it should be close to what your broker shows for this same contract; small gaps can come from bid/ask spread or a different rate/dividend assumption. Leave the override blank to use the solved value.</p>
          </React.Fragment>
        )}

        <div className="section-head"><h2>Scenario: price target by a date</h2></div>
        <div className="form-row" style={{maxWidth:'420px'}}>
          <div className="form-field">
            <label>If {underlying.trim().toUpperCase()||'the underlying'} is at</label>
            <input type="number" step="any" value={targetPrice} onChange={e=>setTargetPrice(e.target.value)} placeholder="e.g. 310.00" />
          </div>
          <div className="form-field">
            <label>by this date</label>
            <input type="date" value={targetDate} onChange={e=>setTargetDate(e.target.value)} max={expiry||undefined} />
          </div>
        </div>
        {!hasBreakevenInputs ? (
          <div className="empty">Look up the underlying's current price above first — the estimate needs it to solve for implied volatility.</div>
        ) : !hasScenarioInputs ? (
          <div className="empty">Enter a target price and a date on or before expiry to see the estimate.</div>
        ) : (
          <React.Fragment>
          <div className="headline-card">
            <div className="label">Estimated P&amp;L for {scenario.contractsForScenario} contract{scenario.contractsForScenario!==1?'s':''}</div>
            <div className={"headline-value "+plClass(scenario.pnlTotal)}>{fmtMoney(scenario.pnlTotal,displayCcy,0)}</div>
            <div className="sub" style={{marginTop:'8px'}}>
              est. premium {fmtMoney(scenario.estimatedPremium,premiumCcy)} (from {fmtMoney(premiumNum,premiumCcy)}) · {scenario.returnPct!==null?fmt(scenario.returnPct,0)+'%':'—'} on premium · {scenario.daysRemainingAtTarget}d left to expiry at that point
            </div>
          </div>
          <p className="hint" style={{marginBottom:'0'}}>
            Priced with Black-Scholes using the implied volatility above, held constant at today's level. That's the standard way to estimate this, but it's still a model, not a guaranteed quote — real IV moves with news, earnings, and market conditions, and a shift in IV between now and your target date would change the real price, sometimes a lot for longer-dated or further-out-of-the-money contracts.
          </p>
          </React.Fragment>
        )}
        </React.Fragment>
      )}
    </div>
  );
}

function LogTrade({account, d, onUpdate}){
  const [side, setSide] = useState('BUY');
  const [assetType, setAssetType] = useState('STOCK'); // STOCK | OPTION
  const [symbol, setSymbol] = useState('');
  const [name, setName] = useState('');
  const [underlying, setUnderlying] = useState('');
  const [expiry, setExpiry] = useState('');
  const [strike, setStrike] = useState('');
  const [right, setRight] = useState('CALL');
  const [qty, setQty] = useState('');
  const [price, setPrice] = useState('');
  const [ccy, setCcy] = useState('USD');
  const [date, setDate] = useState(todayStr());
  const [notes, setNotes] = useState('');
  const [priceLoading, setPriceLoading] = useState(false);
  const [msg, setMsg] = useState(null); // {type:'ok'|'err', text}

  const holdings = d.holdings || [];
  const isOption = assetType === 'OPTION';
  const optionSymbol = isOption ? buildOptionSymbol(underlying, expiry, strike, right) : '';
  const effectiveSymbol = isOption ? optionSymbol : symbol.trim().toUpperCase();
  const multiplier = isOption ? 100 : 1;
  const existing = holdings.find(h => h.symbol.toUpperCase() === effectiveSymbol.toUpperCase() && effectiveSymbol);

  async function handleLookup(){
    if(!symbol.trim()){ setMsg({type:'err', text:'Enter a ticker symbol first.'}); return; }
    setPriceLoading(true); setMsg(null);
    try{
      const p = await lookupPrice(symbol.trim().toUpperCase());
      setPrice(p.price);
      if(p.currency) setCcy(p.currency);
      setMsg({type:'ok', text:'Filled current price for ' + symbol.trim().toUpperCase() + ' as of ' + (p.asOf||'now') + '.'});
    }catch(e){
      setMsg({type:'err', text:e.message});
    }
    setPriceLoading(false);
  }

  async function submit(e){
    e.preventDefault();
    setMsg(null);
    const sym = effectiveSymbol;
    const q = parseFloat(qty);
    const p = parseFloat(price);
    if(!sym || !q || !p || q<=0 || p<=0){
      setMsg({type:'err', text: isOption ? 'Fill in the underlying, expiry, strike, quantity, and premium.' : 'Fill in a valid symbol, quantity, and price.'});
      return;
    }
    const displayName = isOption ? (underlying.trim().toUpperCase() + ' ' + strike + ' ' + (right==='CALL'?'Call':'Put') + ' exp ' + expiry) : (name.trim() || sym);
    const activityEntry = {
      id: uid(), date, time:'', type:'Trade', subType:side,
      description: side + ' ' + q + ' ' + sym + ' @ ' + p + ' ' + ccy + (isOption?' (x100 multiplier)':'') + ' (manual entry)',
      direction:'', symbol:sym, quantity:q, unitPrice:p, commission:0,
      netCash: side==='BUY' ? -(q*p*multiplier) : (q*p*multiplier), ccy,
    };

    if(side === 'BUY'){
      let newHoldings;
      if(existing){
        const totalQty = existing.qty + q;
        const totalCost = (existing.avgCost||0)*existing.qty + p*q;
        const newAvg = totalCost/totalQty;
        newHoldings = holdings.map(h => h.id===existing.id ? {...h, qty:totalQty, avgCost:newAvg, marketPrice:p, marketPriceCcy:ccy, marketValue:totalQty*p*multiplier, marketValueCcy:ccy, unrealized:(p-newAvg)*totalQty*multiplier, unrealizedCcy:ccy} : h);
      } else {
        newHoldings = [...holdings, {
          id: uid(), symbol:sym, name:displayName, secType: isOption?'OPTION':'EQUITY', qty:q,
          marketPrice:p, marketPriceCcy:ccy, avgCost:p, bookValueCad:null,
          marketValue:q*p*multiplier, marketValueCcy:ccy, unrealized:0, unrealizedCcy:ccy, source:'manual', notes:notes.trim(),
        }];
      }
      await onUpdate({holdings:newHoldings, activity:[activityEntry, ...(d.activity||[])]});
      setMsg({type:'ok', text:'Logged buy: ' + q + ' ' + sym + ' @ ' + p + ' ' + ccy + (isOption ? (' (total ' + fmtMoney(q*p*multiplier,ccy) + ')') : '') + '.'});
    } else {
      if(!existing || existing.qty < q){
        setMsg({type:'err', text: existing ? ('You only hold ' + existing.qty + ' of ' + sym + '.') : ('No existing holding found for ' + sym + ' in this account.')});
        return;
      }
      const existingMultiplier = existing.secType==='OPTION' ? 100 : 1;
      const realizedPnl = (p - (existing.avgCost||0)) * q * existingMultiplier;
      const remainingQty = existing.qty - q;
      let newHoldings;
      if(remainingQty <= 0){
        newHoldings = holdings.filter(h => h.id !== existing.id);
      } else {
        newHoldings = holdings.map(h => h.id===existing.id ? {...h, qty:remainingQty, marketValue:remainingQty*h.marketPrice*existingMultiplier, unrealized:(h.marketPrice-h.avgCost)*remainingQty*existingMultiplier} : h);
      }
      const realizedEntry = {
        id: uid(), date, symbol:sym, name: existing.name||sym, orderId:'manual',
        realizedCad: ccy==='CAD' ? realizedPnl : null,
        realizedUsd: ccy==='USD' ? realizedPnl : null,
        netProceedsCad: null, netProceedsUsd: ccy==='USD' ? q*p*existingMultiplier : null,
        initialInvCad: null, initialInvUsd: ccy==='USD' ? -(existing.avgCost*q*existingMultiplier) : null,
        fx: null, source:'manual', notes:notes.trim(),
      };
      await onUpdate({holdings:newHoldings, realized:[realizedEntry, ...(d.realized||[])], activity:[activityEntry, ...(d.activity||[])]});
      setMsg({type:'ok', text:'Logged sell: ' + q + ' ' + sym + ' @ ' + p + ' ' + ccy + '. Realized P&L: ' + fmt(realizedPnl) + ' ' + ccy + '.'});
    }
    setSymbol(''); setName(''); setQty(''); setPrice(''); setUnderlying(''); setExpiry(''); setStrike(''); setNotes('');
  }

  return (
    <div>
      <h1 className="page-title">Log a trade</h1>
      <p className="page-sub">{account?account.name:''} · type a ticker and let Blotter look up the price, or enter it yourself</p>

      <div className="toggle-row" style={{maxWidth:'520px'}}>
        <button className={side==='BUY'?'active':''} onClick={()=>setSide('BUY')} type="button">Buy</button>
        <button className={side==='SELL'?'active':''} onClick={()=>setSide('SELL')} type="button">Sell</button>
      </div>
      <div className="toggle-row" style={{maxWidth:'520px'}}>
        <button className={assetType==='STOCK'?'active':''} onClick={()=>setAssetType('STOCK')} type="button">Stock / ETF</button>
        <button className={assetType==='OPTION'?'active':''} onClick={()=>setAssetType('OPTION')} type="button">Option</button>
      </div>

      <form className="form" onSubmit={submit}>
        {!isOption && (
          <React.Fragment>
          <div className="form-row">
            <div className="form-field">
              <label>Ticker symbol</label>
              <input value={symbol} onChange={e=>setSymbol(e.target.value)} placeholder="e.g. NBIS" />
            </div>
            {side==='BUY' && !existing && (
              <div className="form-field">
                <label>Name (optional)</label>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Company / fund name" />
              </div>
            )}
          </div>
          {existing && <div className="hint">You currently hold {existing.qty} @ avg cost {fmtMoney(existing.avgCost, existing.marketValueCcy)}</div>}
          </React.Fragment>
        )}

        {isOption && (
          <React.Fragment>
          <div className="form-row">
            <div className="form-field">
              <label>Underlying ticker</label>
              <input value={underlying} onChange={e=>setUnderlying(e.target.value)} placeholder="e.g. TSLA" />
            </div>
            <div className="form-field">
              <label>Expiry</label>
              <input type="date" value={expiry} onChange={e=>setExpiry(e.target.value)} />
            </div>
          </div>
          <div className="form-row">
            <div className="form-field">
              <label>Strike</label>
              <input type="number" step="any" value={strike} onChange={e=>setStrike(e.target.value)} placeholder="e.g. 300" />
            </div>
            <div className="form-field" style={{maxWidth:'120px'}}>
              <label>Right</label>
              <select value={right} onChange={e=>setRight(e.target.value)}>
                <option value="CALL">Call</option>
                <option value="PUT">Put</option>
              </select>
            </div>
          </div>
          {optionSymbol && <div className="hint">{optionSymbol} — 1 contract = 100 shares, so totals below are automatically ×100.</div>}
          {existing && <div className="hint">You currently hold {existing.qty} contract{existing.qty!==1?'s':''} @ avg premium {fmtMoney(existing.avgCost, existing.marketValueCcy)}</div>}
          </React.Fragment>
        )}

        <div className="form-row" style={{marginTop:'12px'}}>
          <div className="form-field">
            <label>{isOption ? 'Contracts' : 'Quantity'}</label>
            <input type="number" step="any" value={qty} onChange={e=>setQty(e.target.value)} placeholder="0" />
          </div>
          <div className="form-field">
            <label>{isOption ? 'Premium per share' : 'Price per unit'}</label>
            <div className="inline-btn">
              <input type="number" step="any" value={price} onChange={e=>setPrice(e.target.value)} placeholder="0.00" />
              {!isOption && (
                <button type="button" className="btn secondary sm" disabled={priceLoading} onClick={handleLookup}>
                  {priceLoading ? <span className="spinner"></span> : 'Look up'}
                </button>
              )}
            </div>
          </div>
          <div className="form-field" style={{maxWidth:'90px'}}>
            <label>Currency</label>
            <select value={ccy} onChange={e=>setCcy(e.target.value)}>
              <option>USD</option><option>CAD</option>
            </select>
          </div>
        </div>
        {isOption && qty && price && (
          <div className="hint">Total {side==='BUY'?'cost':'proceeds'}: {fmtMoney(parseFloat(qty||0)*parseFloat(price||0)*100, ccy)}</div>
        )}
        {isOption && (
          <div className="hint" style={{marginBottom:'4px'}}>Options move fast and auto-lookup isn't reliable for them — enter the current premium yourself.</div>
        )}
        <div className="form-row" style={{marginTop:'8px'}}>
          <div className="form-field" style={{maxWidth:'200px'}}>
            <label>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} />
          </div>
          <div className="form-field">
            <label>Notes (optional)</label>
            <input value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Strategy, reason for the trade…" />
          </div>
        </div>
        {msg && <div className={"hint " + (msg.type==='err'?'err':'ok')} style={{marginBottom:'12px'}}>{msg.text}</div>}
        <button className="btn" type="submit">Log {side==='BUY'?'buy':'sell'}</button>
      </form>
    </div>
  );
}

function Import({account, d, onUpdate}){
  const [log, setLog] = useState([]);
  const fileRef = useRef(null);

  function addLog(line){ setLog(prev => [...prev, line]); }

  function handleFiles(files){
    setLog([]);
    Array.from(files).forEach(file => {
      Papa.parse(file, {
        header: true,
        skipEmptyLines: true,
        complete: (results) => {
          const headers = results.meta.fields || [];
          const type = detectCsvType(headers);
          if(type === 'holdings'){
            const rows = normalizeHoldings(results.data);
            const cashRows = normalizeCash(results.data);
            onUpdate({holdings: rows, cash: cashRows});
            addLog('✓ ' + file.name + ' — recognized as a holdings report, loaded ' + rows.length + ' positions and ' + cashRows.length + ' cash balance(s).');
          } else if(type === 'realized'){
            const rows = normalizeRealized(results.data);
            onUpdate({realized: rows});
            addLog('✓ ' + file.name + ' — recognized as a realized gain/loss report, loaded ' + rows.length + ' closed trades.');
          } else if(type === 'activity'){
            const rows = normalizeActivity(results.data);
            onUpdate({activity: rows});
            addLog('✓ ' + file.name + ' — recognized as an activity/transaction export, loaded ' + rows.length + ' entries.');
          } else {
            addLog('✗ ' + file.name + ' — could not recognize this file\'s columns. Expected a holdings, realized gain/loss, or activity export.');
          }
        },
        error: (err) => addLog('✗ ' + file.name + ' — ' + err.message),
      });
    });
  }

  return (
    <div>
      <h1 className="page-title">Import</h1>
      <p className="page-sub">{account?account.name:''} · load CSVs from your brokerage export</p>

      <div className="import-box">
        <h3>Upload CSVs</h3>
        <p>Drop in your holdings report, realized gain/loss report, and/or activity export for this account. Each import replaces the previous data of that type for this account.</p>
        <div className="drop" onClick={()=>fileRef.current.click()}
          onDragOver={e=>e.preventDefault()}
          onDrop={e=>{e.preventDefault(); handleFiles(e.dataTransfer.files);}}>
          Click to choose files, or drag CSVs here
          <input ref={fileRef} type="file" accept=".csv" multiple onChange={e=>handleFiles(e.target.files)} />
        </div>
        {log.length>0 && <div className="import-log">{log.join('\n')}</div>}
      </div>

      <div className="import-box">
        <h3>Currently loaded for {account?account.name:'this account'}</h3>
        <p style={{marginBottom:0}}>
          {(d.holdings||[]).length} holdings · {(d.cash||[]).length} cash balances · {(d.realized||[]).length} realized trades · {(d.activity||[]).length} activity rows
        </p>
      </div>
    </div>
  );
}

function Settings(){
  const [keyId, setKeyId] = useState('');
  const [secret, setSecret] = useState('');
  const [saved, setSaved] = useState(false);
  const [testMsg, setTestMsg] = useState(null);
  const [testing, setTesting] = useState(false);

  const [supaUrl, setSupaUrl] = useState('');
  const [supaAnonKey, setSupaAnonKey] = useState('');
  const [supaSyncKey, setSupaSyncKey] = useState('');
  const [supaSaved, setSupaSaved] = useState(false);
  const [syncMsg, setSyncMsg] = useState(null);
  const [syncing, setSyncing] = useState(false);
  const [cloudTimestamp, setCloudTimestamp] = useState(null);

  useEffect(() => {
    const creds = getAlpacaCreds();
    if(creds){ setKeyId(creds.keyId||''); setSecret(creds.secret||''); setSaved(true); }
    const supa = getSupabaseConfig();
    if(supa){
      setSupaUrl(supa.url||''); setSupaAnonKey(supa.anonKey||''); setSupaSyncKey(supa.syncKey||'');
      setSupaSaved(true);
      checkCloudTimestamp().then(ts => setCloudTimestamp(ts));
    }
  }, []);

  function handleSaveSupa(){
    saveSupabaseConfig(supaUrl.trim(), supaAnonKey.trim(), supaSyncKey.trim());
    setSupaSaved(true);
    setSyncMsg(null);
    checkCloudTimestamp().then(ts => setCloudTimestamp(ts));
  }
  function handleClearSupa(){
    clearSupabaseConfig();
    setSupaUrl(''); setSupaAnonKey(''); setSupaSyncKey(''); setSupaSaved(false); setSyncMsg(null); setCloudTimestamp(null);
  }
  function generateSyncKey(){
    const key = (crypto.randomUUID ? crypto.randomUUID() : (Date.now().toString(36)+Math.random().toString(36).slice(2)));
    setSupaSyncKey(key);
  }
  async function handlePush(){
    setSyncing(true); setSyncMsg(null);
    try{
      const ts = await pushToCloud();
      setSyncMsg({type:'ok', text:'Pushed to cloud at ' + new Date(ts).toLocaleString() + '.'});
      setCloudTimestamp(ts);
    }catch(e){
      setSyncMsg({type:'err', text:e.message});
    }
    setSyncing(false);
  }
  async function handlePull(){
    if(!confirm('This will overwrite everything in this browser with whatever is saved in the cloud. Continue?')) return;
    setSyncing(true); setSyncMsg(null);
    try{
      const ts = await pullFromCloud();
      setSyncMsg({type:'ok', text:'Pulled from cloud (saved ' + new Date(ts).toLocaleString() + '). Reloading…'});
      setTimeout(() => window.location.reload(), 1200);
    }catch(e){
      setSyncMsg({type:'err', text:e.message});
      setSyncing(false);
    }
  }

  function handleSave(){
    saveAlpacaCreds(keyId.trim(), secret.trim());
    setSaved(true);
    setTestMsg(null);
  }
  function handleClear(){
    clearAlpacaCreds();
    setKeyId(''); setSecret(''); setSaved(false); setTestMsg(null);
  }
  async function handleTest(){
    setTesting(true); setTestMsg(null);
    try{
      const p = await lookupPrice('AAPL');
      setTestMsg({type:'ok', text:'Connected — AAPL last traded at ' + fmtMoney(p.price,'USD') + '.'});
    }catch(e){
      setTestMsg({type:'err', text:e.message});
    }
    setTesting(false);
  }

  return (
    <div>
      <h1 className="page-title">Settings</h1>
      <p className="page-sub">Alpaca API credentials for price lookups — stored only in this browser</p>

      <div className="import-box">
        <h3>Alpaca Market Data API</h3>
        <p>
          Get a free key from your <a href="https://app.alpaca.markets/paper/dashboard/overview" target="_blank" rel="noopener" style={{color:'var(--brass)'}}>Alpaca paper trading dashboard</a>. This covers stock and ETF price lookups only — options contracts and FX aren't covered by this key (FX uses a separate free service automatically; options need manual entry).
        </p>
        <div className="hint" style={{marginBottom:'12px'}}>
          Heads up: Alpaca's market-data endpoint has a known, longstanding browser CORS issue (unrelated to your key) — if the test below fails with a network/CORS error, that's Alpaca's API behavior, not a mistake in your key.
        </div>
        <div className="form-row" style={{maxWidth:'520px'}}>
          <div className="form-field">
            <label>API Key ID</label>
            <input value={keyId} onChange={e=>setKeyId(e.target.value)} placeholder="PK..." />
          </div>
          <div className="form-field">
            <label>Secret Key</label>
            <input type="password" value={secret} onChange={e=>setSecret(e.target.value)} placeholder="•••••••••" />
          </div>
        </div>
        <div className="inline-btn" style={{marginTop:'8px'}}>
          <button className="btn" type="button" onClick={handleSave} disabled={!keyId.trim()||!secret.trim()}>Save</button>
          <button className="btn secondary sm" type="button" onClick={handleTest} disabled={!saved||testing}>
            {testing ? <span className="spinner"></span> : 'Test connection'}
          </button>
          {saved && <button className="btn secondary sm" type="button" onClick={handleClear}>Clear</button>}
        </div>
        {testMsg && <div className={"hint " + (testMsg.type==='err'?'err':'ok')} style={{marginTop:'10px'}}>{testMsg.text}</div>}
      </div>

      <div className="import-box">
        <h3>Cloud sync (Supabase)</h3>
        <p>
          Lets you use the same data on multiple devices (e.g. desktop and phone). This needs a free <a href="https://supabase.com" target="_blank" rel="noopener" style={{color:'var(--brass)'}}>Supabase</a> project — a small hosted database with its own API.
        </p>
        <div className="hint" style={{marginBottom:'12px'}}>
          One-time setup: create a free Supabase project, then in its SQL Editor run:
          <pre style={{background:'var(--bg)', padding:'10px', borderRadius:'4px', overflowX:'auto', fontSize:'11.5px', marginTop:'6px'}}>{`create table blotter_sync (
  sync_key text primary key,
  data jsonb not null,
  updated_at timestamptz not null default now()
);
alter table blotter_sync enable row level security;
create policy "allow all" on blotter_sync for all using (true) with check (true);`}</pre>
          Then grab your Project URL and anon/public API key from Settings → API in the Supabase dashboard, and paste them below. There's no real login here — the sync key you generate is a shared secret between your own devices, so keep it as private as a password and enter the exact same URL, anon key, and sync key on every device you want synced.
        </div>
        <div className="form-row" style={{maxWidth:'560px'}}>
          <div className="form-field">
            <label>Supabase Project URL</label>
            <input value={supaUrl} onChange={e=>setSupaUrl(e.target.value)} placeholder="https://xxxx.supabase.co" />
          </div>
        </div>
        <div className="form-row" style={{maxWidth:'560px'}}>
          <div className="form-field">
            <label>Anon (public) API key</label>
            <input type="password" value={supaAnonKey} onChange={e=>setSupaAnonKey(e.target.value)} placeholder="eyJ..." />
          </div>
        </div>
        <div className="form-row" style={{maxWidth:'560px'}}>
          <div className="form-field">
            <label>Sync key (same on every device)</label>
            <div className="inline-btn">
              <input value={supaSyncKey} onChange={e=>setSupaSyncKey(e.target.value)} placeholder="click Generate, then copy to your other device" />
              <button className="btn secondary sm" type="button" onClick={generateSyncKey}>Generate</button>
            </div>
          </div>
        </div>
        <div className="inline-btn" style={{marginTop:'8px', flexWrap:'wrap'}}>
          <button className="btn" type="button" onClick={handleSaveSupa} disabled={!supaUrl.trim()||!supaAnonKey.trim()||!supaSyncKey.trim()}>Save</button>
          <button className="btn secondary sm" type="button" onClick={handlePush} disabled={!supaSaved||syncing}>
            {syncing ? <span className="spinner"></span> : 'Push this device \u2192 cloud'}
          </button>
          <button className="btn secondary sm" type="button" onClick={handlePull} disabled={!supaSaved||syncing}>
            {syncing ? <span className="spinner"></span> : 'Pull cloud \u2192 this device'}
          </button>
          {supaSaved && <button className="btn secondary sm" type="button" onClick={handleClearSupa}>Clear</button>}
        </div>
        {cloudTimestamp && <div className="hint" style={{marginTop:'10px'}}>Cloud last updated: {new Date(cloudTimestamp).toLocaleString()}</div>}
        {syncMsg && <div className={"hint " + (syncMsg.type==='err'?'err':'ok')} style={{marginTop:'10px'}}>{syncMsg.text}</div>}
        <p className="hint" style={{marginTop:'10px'}}>This is manual, not automatic — push after making changes on one device, pull before starting work on another. There's no conflict resolution: pulling always overwrites this device completely, and pushing always overwrites the cloud completely, so avoid editing on two devices at the same time without syncing in between.</p>
      </div>

      <div className="import-box">
        <h3>How your data is stored</h3>
        <p style={{marginBottom:0}}>Accounts, holdings, and trades are saved in this browser's local storage. Without cloud sync set up above, that data stays on this one device/browser only — it doesn't sync anywhere and isn't sent to Anthropic or anyone else. It only leaves your browser when this page calls Alpaca for a price, or Supabase to sync (if you've set that up). Clearing your browser data will erase everything not backed up to the cloud.</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body></html>
